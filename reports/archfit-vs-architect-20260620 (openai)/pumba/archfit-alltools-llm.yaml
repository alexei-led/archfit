# Generated by archfit init — TODO: review and promote gate: warn to gate: fail
version: 1

# Minimum severity for BC coupling advisories: low|medium|high|critical
bc_advisory_min_severity: medium

tools:
  go:
    enabled: "on"
  python:
    enabled: "off"
  typescript:
    enabled: "off"
  scip:
    enabled: "on"
  complexity:
    enabled: "on"
  clones:
    enabled: "on"
  gitnexus:
    enabled: "on"
  llm:
    provider: anthropic
    model: claude-opus-4-8
layers:
  - core
  - cmd

modules:
  cmd:
    paths:
      - "cmd/**"
    public:
      - "cmd"
    layer: cmd
  mocks:
    paths:
      - "mocks/**"
    public:
      - "mocks"
    layer: core
  pkg_chaos:
    paths:
      - "pkg/chaos/**"
    public:
      - "pkg/chaos"
    layer: core
  pkg_container:
    paths:
      - "pkg/container/**"
    public:
      - "pkg/container"
    layer: core
  pkg_runtime:
    paths:
      - "pkg/runtime/**"
    public:
      - "pkg/runtime"
    layer: core
  pkg_util:
    paths:
      - "pkg/util/**"
    public:
      - "pkg/util"
    layer: core

rules:
  - id: no-forbidden-deps
    type: forbidden_dependency
    gate: warn
