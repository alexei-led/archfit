# Generated by archfit init — TODO: review and promote gate: warn to gate: fail
version: 1

# Minimum severity for BC coupling advisories: low|medium|high|critical
bc_advisory_min_severity: medium

tools:
  go:
    enabled: "off"
  python:
    enabled: "off"
  typescript:
    enabled: "on"
  scip:
    enabled: "on"
  complexity:
    enabled: "on"
  clones:
    enabled: "on"
  gitnexus:
    enabled: "on"
  llm:
    provider: anthropic
    model: claude-opus-4-8
layers:
  - core

modules:
  bin:
    paths:
      - "src/bin/**"
    public:
      - "src/bin/**"
    layer: core
  context:
    paths:
      - "src/context/**"
    public:
      - "src/context/**"
    layer: core
  db:
    paths:
      - "src/db/**"
    public:
      - "src/db/**"
    layer: core
  extraction:
    paths:
      - "src/extraction/**"
    public:
      - "src/extraction/**"
    layer: core
  graph:
    paths:
      - "src/graph/**"
    public:
      - "src/graph/**"
    layer: core
  installer:
    paths:
      - "src/installer/**"
    public:
      - "src/installer/**"
    layer: core
  mcp:
    paths:
      - "src/mcp/**"
    public:
      - "src/mcp/**"
    layer: core
  resolution:
    paths:
      - "src/resolution/**"
    public:
      - "src/resolution/**"
    layer: core
  search:
    paths:
      - "src/search/**"
    public:
      - "src/search/**"
    layer: core
  sync:
    paths:
      - "src/sync/**"
    public:
      - "src/sync/**"
    layer: core
  ui:
    paths:
      - "src/ui/**"
    public:
      - "src/ui/**"
    layer: core
  upgrade:
    paths:
      - "src/upgrade/**"
    public:
      - "src/upgrade/**"
    layer: core

rules:
  - id: no-forbidden-deps
    type: forbidden_dependency
    gate: warn
