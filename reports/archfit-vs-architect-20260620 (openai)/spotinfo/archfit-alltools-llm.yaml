# Generated by archfit init — TODO: review and promote gate: warn to gate: fail
version: 1

# Minimum severity for BC coupling advisories: low|medium|high|critical
bc_advisory_min_severity: medium

tools:
  go:
    enabled: "on"
  python:
    enabled: "off"
  typescript:
    enabled: "off"
  scip:
    enabled: "on"
  complexity:
    enabled: "on"
  clones:
    enabled: "on"
  gitnexus:
    enabled: "on"
  llm:
    provider: anthropic
    model: claude-opus-4-8
layers:
  - core
  - cmd

modules:
  cmd_spotinfo:
    paths:
      - "cmd/spotinfo/**"
    public:
      - "cmd/spotinfo"
    layer: cmd
  mcp:
    paths:
      - "internal/mcp/**"
    public:
      - "internal/mcp"
    layer: core
  spot:
    paths:
      - "internal/spot/**"
    public:
      - "internal/spot"
    layer: core

rules:
  - id: no-forbidden-deps
    type: forbidden_dependency
    gate: warn
