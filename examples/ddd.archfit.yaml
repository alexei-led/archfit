# archfit starter: DDD bounded contexts (subdomain-driven volatility)
#
# In Balanced Coupling terms, the subdomain sets volatility: Core -> high,
# Supporting -> medium, Generic -> low. Declaring subdomains is what lets archfit
# tell cohesion (good) from distributed-monolith risk. Each bounded context is a
# module; contexts integrate through a published contract (public surface), never
# through each other's internals (which would be intrusive coupling across a
# context boundary -> a flag).
#   archfit analyze --config .archfit.yaml
#   archfit analyze --format scorecard --config .archfit.yaml
version: 1
coupling:
  min_severity: medium
languages:
  go:
    enabled: true
  typescript:
    enabled: false
  python:
    enabled: false
layers:
  - domain
  - application
  - infrastructure
modules:
  # Core subdomain: the competitive advantage, changes often (high volatility).
  pricing:
    paths:
      - internal/pricing/**
    public:
      - internal/pricing/contract
    internal:
      - internal/pricing/internal/**
    layer: domain
    subdomain: core
    owner: team-pricing
  ordering:
    paths:
      - internal/ordering/**
    public:
      - internal/ordering/contract
    internal:
      - internal/ordering/internal/**
    layer: domain
    subdomain: core
    owner: team-ordering
  # Supporting subdomain: necessary, less differentiating (low volatility).
  catalog:
    paths:
      - internal/catalog/**
    public:
      - internal/catalog/contract
    layer: domain
    subdomain: supporting
    owner: team-catalog
  # Generic subdomain: solved problem, stable (low volatility neutralizes risk).
  notifications:
    paths:
      - internal/notifications/**
    public:
      - internal/notifications/contract
    layer: infrastructure
    subdomain: generic
    owner: team-platform
rules:
  # Cross-context: only through the published contract, never the internals.
  - id: contexts_via_contract
    type: public_api_only
    gate: fail
  # Pricing must not reach into ordering internals (intrusive cross-context).
  - id: pricing_no_ordering_internal
    type: forbidden_dependency
    from: internal/pricing/**
    to: internal/ordering/internal/**
    gate: fail
  - id: layer_direction
    type: forbidden_layer_direction
    gate: fail
  - id: no_cycles
    type: cycle
    gate: fail
