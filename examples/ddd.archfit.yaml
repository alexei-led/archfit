# archfit starter: DDD bounded contexts (subdomain-driven volatility)
#
# In Balanced Coupling terms, the subdomain sets volatility: Core -> high,
# Supporting -> low, Generic -> low. Declaring subdomains is what lets archfit
# tell cohesion (good) from distributed-monolith risk. Each bounded context is a
# module; contexts integrate through a published contract (public surface), never
# through each other's internals (which would be intrusive coupling across a
# context boundary -> a flag). Every context declares its contract package as
# public and the rest of its tree as internal, so public_api_only blocks an
# import that bypasses the contract.
#   archfit analyze --config .archfit.yaml
#   archfit analyze --format scorecard --config .archfit.yaml
version: 2
coupling:
  min_severity: medium
languages:
  go:
    enabled: true
  typescript:
    enabled: false
  python:
    enabled: false
layers:
  - domain
  - application
  - infrastructure
modules:
  # Core subdomain: the competitive advantage, changes often (high volatility).
  pricing:
    paths:
      - internal/pricing/**
    public:
      - internal/pricing/contract
    internal:
      - internal/pricing/**
    layer: domain
    subdomain: core
    owner: team-pricing
  ordering:
    paths:
      - internal/ordering/**
    public:
      - internal/ordering/contract
    internal:
      - internal/ordering/**
    layer: domain
    subdomain: core
    owner: team-ordering
  # Supporting subdomain: necessary, less differentiating (low volatility).
  catalog:
    paths:
      - internal/catalog/**
    public:
      - internal/catalog/contract
    internal:
      - internal/catalog/**
    layer: domain
    subdomain: supporting
    owner: team-catalog
  # Generic subdomain: solved problem, stable (low volatility neutralizes risk).
  notifications:
    paths:
      - internal/notifications/**
    public:
      - internal/notifications/contract
    internal:
      - internal/notifications/**
    layer: infrastructure
    subdomain: generic
    owner: team-platform
rules:
  # Cross-context: only through the published contract, never the internals.
  # A pricing import of anything under internal/ordering/ except its contract
  # package fails here.
  - id: contexts_via_contract
    type: public_api_only
    gate: fail
  - id: layer_direction
    type: forbidden_layer_direction
    gate: fail
  # No dependency cycle among the declared modules. module_cycle sees cycles
  # that close across modules through different files; the node-level
  # cycle rule cannot (on Go it never fires).
  - id: no_module_cycles
    type: module_cycle
    gate: fail
