# archfit starter: Go monolith (single deployable, layered packages)
#
# A flat config produces noise: distance falls back to code structure and BC
# advisories flood. This template is fully specified — every module declares an
# owner and a subdomain/volatility — so distance and volatility classify cleanly.
# Replace the module paths and owners with your own, then run:
#   archfit analyze --config .archfit.yaml
version: 2
coupling:
  min_severity: medium
languages:
  go:
    enabled: true
  typescript:
    enabled: false
  python:
    enabled: false
# Inner -> outer. forbidden_layer_direction flags any inner->outer dependency.
layers:
  - domain
  - application
  - adapter
  - cmd
modules:
  # Other modules import the domain's root package only. Pairing it with an
  # internal glob over the rest of the module is what makes public_api_only
  # block a bypass: a nested internal/ dir is already compiler-enforced in Go.
  domain:
    paths:
      - internal/domain/**
    public:
      - internal/domain
    internal:
      - internal/domain/**
    layer: domain
    subdomain: core # core -> high volatility
    owner: team-core
  application:
    paths:
      - internal/app/**
    public:
      - internal/app
    layer: application
    subdomain: core
    owner: team-core
  adapter:
    paths:
      - internal/adapter/**
    public:
      - internal/adapter
    layer: adapter
    subdomain: supporting # supporting -> low volatility
    owner: team-platform
  cmd:
    paths:
      - cmd/**
    layer: cmd
    subdomain: generic # generic -> low volatility
    owner: team-platform
rules:
  # Domain stays pure: no dependency on the outer adapter layer.
  - id: domain_no_adapter
    type: forbidden_dependency
    from: internal/domain/**
    to: internal/adapter/**
    gate: fail
  # Domain logic takes time as an input instead of reading the wall clock.
  # Needs ast-grep (sg); check a pattern with `sg run --lang go --pattern ...`.
  - id: domain_no_clock
    type: forbidden_pattern
    from: internal/domain/**
    gate: fail
    patterns:
      - id: domain_clock
        lang: go
        rule: time.Now()
  # Respect the layer order declared above.
  - id: layer_direction
    type: forbidden_layer_direction
    gate: fail
  # No importing another module's declared internal packages (the domain's
  # sub-packages above) or a Go internal/ package across modules.
  - id: public_api_only
    type: public_api_only
    gate: fail
  # No dependency cycle among the declared modules. module_cycle sees cycles
  # that close across modules through different files; the node-level
  # cycle rule cannot (on Go it never fires).
  - id: no_module_cycles
    type: module_cycle
    gate: fail
