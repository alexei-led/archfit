# The Archfit policy, written by archfit init from the code as it is today.
# Review the modules, public, depends_on and exceptions, then commit it.
version: 3
owners:
  - acme
modules:
  app:
    paths:
      - src/app/**
    public:
      - src/app
    depends_on:
      - store
      - util
  generated:
    paths:
      - src/generated/**
    public:
      - src/generated
  root:
    paths:
      - "*.ts"
    public:
      - "*.ts"
    depends_on:
      - app
  store:
    paths:
      - src/store/**
    public:
      - src/store
    depends_on:
      - generated
      - util
  util:
    paths:
      - src/util/**
    public:
      - src/util
rules:
  - id: contain-network
    only:
      use: network
      in:
        - app
    why: Network code stays in the modules that used it when archfit init wrote this policy.
  - id: contain-database
    only:
      use: database
      in:
        - store
    why: Database code stays in the modules that used it when archfit init wrote this policy.
exceptions:
  - rule: duplication
    from: app
    to: util
    why: The error existed when archfit init wrote this policy.
generated:
  - src/generated/**
tests:
  - "**/*.{test,spec}.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
