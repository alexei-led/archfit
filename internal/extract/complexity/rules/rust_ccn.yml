# CCN proxy rules for Rust — used by the ast-grep complexity backend.
# Covers all function items — no pub visibility filter.
#
# rs-ccn-func: function items → line range
# rs-ccn-dp:   decision points → if/for/while/loop/match_arm/&&/||

id: rs-ccn-func
language: Rust
rule:
  kind: function_item
  has:
    field: name
    pattern: $NAME
---
# Decision-point rules for Rust.
# Rust-specific decision points:
#   match_arm: each arm in a match expression adds a branch; all arms counted
#              including the wildcard `_` arm (conservative; good for recall)
#   loop_expression: bare `loop {}` is an infinite loop with an implicit break branch
#   if_expression covers both `if cond {}` and `if let Pat = expr {}` in tree-sitter
#   try_expression: the `?` error-propagation operator — lizard counts each `x?` as a
#                   branch; tree-sitter exposes it as try_expression
id: rs-ccn-dp
language: Rust
rule:
  any:
    - kind: if_expression
    - kind: for_expression
    - kind: while_expression
    - kind: loop_expression
    - kind: match_arm
    - kind: try_expression
    - pattern: $A && $B
    - pattern: $A || $B
