# CCN proxy rules for Go — used by the ast-grep complexity backend.
# Separate from syntax/go.yml: no visibility filter — covers ALL functions
# including unexported ones.
#
# go-ccn-func:   function declarations   → provides line range for DP attribution
# go-ccn-method: method declarations     → provides line range for DP attribution
# go-ccn-dp:     decision points         → if/for/case/&&/||

id: go-ccn-func
language: Go
rule:
  kind: function_declaration
  has:
    field: name
    pattern: $NAME
---
id: go-ccn-method
language: Go
rule:
  kind: method_declaration
  has:
    field: name
    pattern: $NAME
---
# Decision-point rules: each node kind that adds a branch to McCabe CCN.
# Go decision points: if, for, switch/select case, &&, ||.
# The `any:` list mixes kind-based and pattern-based matchers — valid in sg YAML.
# pattern: $A && $B matches each binary_expression with &&; chained a&&b&&c
# produces two matches (two operators = two branch points) — correct for CCN.
id: go-ccn-dp
language: Go
rule:
  any:
    - kind: if_statement
    - kind: for_statement
    - kind: expression_case_clause
    - kind: type_case_clause
    - kind: communication_case
    - pattern: $A && $B
    - pattern: $A || $B
