# CCN proxy rules for Python — used by the ast-grep complexity backend.
# No underscore filter — covers all named functions and methods.
#
# py-ccn-func: function/method definitions → line range
# py-ccn-dp:   decision points → if/elif/for/while/except/ternary/and/or

id: py-ccn-func
language: Python
rule:
  kind: function_definition
  has:
    field: name
    pattern: $NAME
---
# Decision-point rules for Python.
# Python-specific decision points:
#   elif_clause: each elif adds a branch (distinct from if_statement in tree-sitter)
#   except_clause: each except handler is a branch
#   conditional_expression: the `x if cond else y` ternary form
#   boolean_operator: `and`/`or` — pattern matches boolean_operator nodes
#   case_clause: each arm of a Python 3.10+ `match` statement (PEP 634)
#   if_clause: the `if` condition inside a list/set/dict/generator comprehension
#   for_in_clause: the `for x in y` inside a comprehension (each is a branch)
id: py-ccn-dp
language: Python
rule:
  any:
    - kind: if_statement
    - kind: elif_clause
    - kind: for_statement
    - kind: while_statement
    - kind: except_clause
    - kind: conditional_expression
    - kind: case_clause
    - kind: if_clause
    - kind: for_in_clause
    - pattern: $A and $B
    - pattern: $A or $B
