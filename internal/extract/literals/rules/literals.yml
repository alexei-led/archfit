id: js-quoted
language: JavaScript
rule:
  any:
    - kind: string
    - all:
        - kind: template_string
        - not: {has: {kind: template_substitution}}
  not:
    any:
      - inside: {kind: import_statement, field: source}
      - inside: {kind: export_statement, field: source}
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            has: {field: function, regex: '^(require|import)$'}
---
id: py-string
language: Python
rule:
  kind: string
  not:
    inside:
      kind: expression_statement
      stopBy:
        not:
          any:
            - kind: parenthesized_expression
            - kind: concatenated_string
---
id: rs-string
language: Rust
rule:
  any:
    - kind: string_literal
    - kind: raw_string_literal
---
id: cs-quoted
language: CSharp
rule:
  kind: string_literal
---
id: cs-verbatim
language: CSharp
rule:
  kind: verbatim_string_literal
---
id: cs-raw
language: CSharp
rule:
  kind: raw_string_literal
