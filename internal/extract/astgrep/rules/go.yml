# Embedded ast-grep rules for Go declaration and route extraction.
# Each rule's id maps to a SyntaxFact Kind (and optionally Framework) in the adapter.
# Validated against sg 0.44.0 with Go tree-sitter grammar.
#
# ruleId → Kind mapping (see syntax.go):
#   go-func         → function  (exported top-level functions)
#   go-method       → method    (exported methods)
#   go-struct       → struct    (exported struct types)
#   go-interface    → interface (exported interface types)
#   go-type-alias   → type_alias (exported type aliases and named types)
#   go-route-net-http → route, framework=net/http
#   go-route-gin    → route, framework=gin
#   go-route-echo   → route, framework=echo
#   go-route-chi    → route, framework=chi
#   go-route-fiber  → route, framework=fiber
#   go-route-gorilla → route, framework=gorilla/mux
#   go-handler-sig  → function  (handler signature: exported fn with http.ResponseWriter param)
#   go-type-leak    → type_leak (exported struct fields with qualified external-package types)

id: go-func
language: go
rule:
  kind: function_declaration
  has:
    field: name
    pattern: $NAME
    regex: ^[A-Z]
---
id: go-method
language: go
rule:
  kind: method_declaration
  has:
    field: name
    pattern: $NAME
    regex: ^[A-Z]
---
id: go-struct
language: go
rule:
  kind: type_spec
  all:
    - has:
        field: name
        pattern: $NAME
        regex: ^[A-Z]
    - has:
        field: type
        kind: struct_type
  inside:
    kind: type_declaration
---
id: go-interface
language: go
rule:
  kind: type_spec
  all:
    - has:
        field: name
        pattern: $NAME
        regex: ^[A-Z]
    - has:
        field: type
        kind: interface_type
  inside:
    kind: type_declaration
---
# go-type-alias matches exported type aliases (type Foo = Bar) and named types
# (type Foo Bar) that are neither struct nor interface. The name is extracted
# from the match text in the adapter via "type (\w+)" regex since nested
# has+pattern on type_declaration children does not propagate $NAME.
id: go-type-alias
language: go
rule:
  kind: type_declaration
  all:
    - not:
        has:
          kind: type_spec
          has:
            field: type
            any:
              - kind: struct_type
              - kind: interface_type
    - has:
        kind: type_spec
        has:
          field: name
          regex: ^[A-Z]
---
# Route rules: one per framework. ruleId carries both Kind=route and Framework.
# $PATH captures the first string-literal argument (the URL pattern).
# net/http: mux.HandleFunc("/path", handler) and mux.Handle("/path", handler)
id: go-route-net-http
language: go
rule:
  pattern: $RECV.HandleFunc($PATH, $HANDLER)
---
id: go-route-net-http-handle
language: go
rule:
  pattern: $RECV.Handle($PATH, $HANDLER)
---
# gin: r.GET/POST/PUT/DELETE/PATCH("/path", handlers...)
id: go-route-gin
language: go
rule:
  any:
    - pattern: $RECV.GET($PATH, $$$)
    - pattern: $RECV.POST($PATH, $$$)
    - pattern: $RECV.PUT($PATH, $$$)
    - pattern: $RECV.DELETE($PATH, $$$)
    - pattern: $RECV.PATCH($PATH, $$$)
    - pattern: $RECV.HEAD($PATH, $$$)
    - pattern: $RECV.OPTIONS($PATH, $$$)
---
# echo: e.GET/POST/PUT/DELETE/PATCH("/path", handler)
id: go-route-echo
language: go
rule:
  any:
    - pattern: $RECV.GET($PATH, $HANDLER)
    - pattern: $RECV.POST($PATH, $HANDLER)
    - pattern: $RECV.PUT($PATH, $HANDLER)
    - pattern: $RECV.DELETE($PATH, $HANDLER)
    - pattern: $RECV.PATCH($PATH, $HANDLER)
---
# chi: r.Get/Post/Put/Delete/Patch("/path", handler)
id: go-route-chi
language: go
rule:
  any:
    - pattern: $RECV.Get($PATH, $HANDLER)
    - pattern: $RECV.Post($PATH, $HANDLER)
    - pattern: $RECV.Put($PATH, $HANDLER)
    - pattern: $RECV.Delete($PATH, $HANDLER)
    - pattern: $RECV.Patch($PATH, $HANDLER)
---
# fiber: app.Get/Post/Put/Delete/Patch("/path", handler)
id: go-route-fiber
language: go
rule:
  any:
    - pattern: $RECV.Get($PATH, $HANDLER)
    - pattern: $RECV.Post($PATH, $HANDLER)
    - pattern: $RECV.Put($PATH, $HANDLER)
    - pattern: $RECV.Delete($PATH, $HANDLER)
    - pattern: $RECV.Patch($PATH, $HANDLER)
---
# gorilla/mux: r.HandleFunc("/path", handler).Methods("GET")
# The outer call matches HandleFunc; Methods chaining is advisory only.
id: go-route-gorilla
language: go
rule:
  pattern: $RECV.HandleFunc($PATH, $HANDLER)
---
# Import-signal rules: used by the adapter (IsSignal=true) to confirm that the
# file actually imports the route framework before emitting route facts.
# Signal rules are NEVER emitted as SyntaxFacts — they only populate the
# per-file framework-confirmed map in the two-pass gating logic.
#
# Extensibility: to add a new framework, add one route rule + one signal rule
# here + one entry in goRuleKinds (syntax.go) with IsSignal:true.
#
# go-import-net-http: stdlib import — present in any file that calls net/http.
id: go-import-net-http
language: go
rule:
  kind: import_spec
  has:
    pattern: '"net/http"'
---
id: go-import-gin
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/gin-gonic/gin"'
---
id: go-import-echo
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/labstack/echo/v4"'
---
# chi uses different import paths across major versions; cover v4 and v5.
id: go-import-chi
language: go
rule:
  kind: import_spec
  any:
    - has:
        pattern: '"github.com/go-chi/chi/v5"'
    - has:
        pattern: '"github.com/go-chi/chi"'
---
id: go-import-fiber
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/gofiber/fiber/v2"'
---
id: go-import-gorilla
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/gorilla/mux"'
---
# Test-framework import rules: emit test_import facts for production Go files
# importing test libraries. NOT signal rules — emitted as SyntaxFacts directly.
# ruleId → Kind=test_import (see syntax.go goRuleKinds).
# Covered: testify suite, gomock (uber + golang), go-sqlmock.
id: go-test-import-testify-mock
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/stretchr/testify/mock"'
---
id: go-test-import-testify-assert
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/stretchr/testify/assert"'
---
id: go-test-import-testify-require
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/stretchr/testify/require"'
---
id: go-test-import-testify-suite
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/stretchr/testify/suite"'
---
id: go-test-import-gomock-uber
language: go
rule:
  kind: import_spec
  has:
    pattern: '"go.uber.org/mock/gomock"'
---
id: go-test-import-gomock-golang
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/golang/mock/gomock"'
---
id: go-test-import-sqlmock
language: go
rule:
  kind: import_spec
  has:
    pattern: '"github.com/DATA-DOG/go-sqlmock"'
---
# go-struct-field: matches exported struct type declarations and estimates the
# field count from the line range (endLine - startLine - 1). One fact per struct.
# The field count estimate is consumed by the struct_field_max rule and the
# struct_field_density report-only metric.
# Ceiling: multi-line field declarations and single-line struct literals diverge
# from the line-count estimate; use as an approximate count.
id: go-struct-field
language: go
rule:
  kind: type_spec
  all:
    - has:
        field: name
        pattern: $NAME
        regex: ^[A-Z]
    - has:
        field: type
        kind: struct_type
  inside:
    kind: type_declaration
---
# Panic-operation rule: panic() calls — production-only signal.
# ruleId maps to kindPanicOp in goRuleKinds (syntax.go).
# regex: '^panic\(' — the anchored paren excludes panicHelper() and other
# functions whose names start with "panic" but are not the builtin.
id: go-panic
language: go
rule:
  kind: call_expression
  regex: ^panic\(
---
# go-test-fn: matches Go test functions (func TestXxx(t *testing.T)).
# Emits test_fn facts consumed by the test_density report-only metric.
# Ceiling: only fires on files sg scans; Go's convention places tests in *_test.go
# which sg scans unconditionally (no file-filter in the adapter).
id: go-test-fn
language: go
rule:
  kind: function_declaration
  has:
    field: name
    pattern: $NAME
    regex: ^Test
---
# go-type-leak: exported struct fields whose type is a qualified (external-package)
# type. Matches both direct (pkg.Type) and pointer (*pkg.Type) forms.
# ruleId maps to kindTypeLeak in goRuleKinds (syntax.go).
# $PKG = package selector (e.g. "cli"), $TYPE = type name (e.g. "Context").
# $FIELD = exported field name (must start with uppercase — Go export rule).
#
# Accepted ceiling (documented): this is a candidate-surfacer, not an exhaustive scanner.
# Covered: direct qualified fields (pkg.Type), pointer fields (*pkg.Type).
# NOT covered: slice fields ([]pkg.Type), map fields (map[K]pkg.Type), generics
# (pkg.Type[T]), embedded types (pkg.Type without a field name). These composite
# shapes require multi-level has/inside nesting in the Go tree-sitter grammar and
# represent a smaller share of real type-leak cases. The LLM/human path covers the
# residue. For func return types see go-func-type-leak below.
# Language ceiling: Go only. Rust qualified types (crate::Module::Type) and
# TypeScript import-path types require different grammar patterns — extend in a future task.
id: go-type-leak
language: go
rule:
  kind: field_declaration
  inside:
    kind: struct_type
    stopBy: end
    inside:
      kind: type_spec
      stopBy: end
      has:
        field: name
        pattern: $STRUCT
        regex: ^[A-Z]
      inside:
        kind: type_declaration
  all:
    - has:
        field: name
        pattern: $FIELD
        regex: ^[A-Z]
    - has:
        any:
          - kind: qualified_type
            pattern: $PKG.$TYPE
          - kind: pointer_type
            has:
              kind: qualified_type
              pattern: $PKG.$TYPE
---
# go-func-type-leak: exported functions or methods whose return type is a
# qualified (external-package) type. Matches direct, pointer, and common multi-result
# tuple returns (the idiomatic (pkg.Type, error) form).
# $PKG = package selector, $TYPE = type name, $NAME = function/method name.
# ruleId maps to kindTypeLeak in goRuleKinds (syntax.go), same as go-type-leak.
#
# Covered shapes:
#   - Single return: func F() pkg.Type
#   - Single pointer: func F() *pkg.Type
#   - Multi-result tuple: func F() (pkg.Type, error), func F() (*pkg.Type, error),
#     func F() (a, pkg.Type, error) — any result parameter_list containing a
#     qualified_type (direct or pointer) anywhere inside it.
#
# Accepted ceiling (documented): does not match every generic/nested composite shape
# (e.g. func F() ([]pkg.Type, error), map results, generics like pkg.Type[T]).
# Those are structurally complex in the Go tree-sitter grammar and represent a
# small fraction of real type-leak cases. The LLM/human path covers the residue.
# go-type-leak (struct fields) has a similar ceiling for slices/maps/generics/embedded.
id: go-func-type-leak
language: go
rule:
  any:
    - all:
        - kind: function_declaration
        - has:
            field: name
            pattern: $NAME
            regex: ^[A-Z]
        - has:
            field: result
            any:
              - kind: qualified_type
                pattern: $PKG.$TYPE
              - kind: pointer_type
                has:
                  kind: qualified_type
                  pattern: $PKG.$TYPE
              - kind: parameter_list
                has:
                  stopBy: end
                  any:
                    - kind: qualified_type
                      pattern: $PKG.$TYPE
                    - kind: pointer_type
                      has:
                        kind: qualified_type
                        pattern: $PKG.$TYPE
    - all:
        - kind: method_declaration
        - has:
            field: name
            pattern: $NAME
            regex: ^[A-Z]
        - has:
            field: result
            any:
              - kind: qualified_type
                pattern: $PKG.$TYPE
              - kind: pointer_type
                has:
                  kind: qualified_type
                  pattern: $PKG.$TYPE
              - kind: parameter_list
                has:
                  stopBy: end
                  any:
                    - kind: qualified_type
                      pattern: $PKG.$TYPE
                    - kind: pointer_type
                      has:
                        kind: qualified_type
                        pattern: $PKG.$TYPE
