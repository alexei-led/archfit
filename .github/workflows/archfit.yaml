# Archfit Action 3 remains available for manual runs until Action 4.
name: archfit

# Milestone 2 restores automatic triggers with Action 4.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What a dispatched run does
        type: choice
        options:
          - report
          - discovery
          - baseline
          - reanchor
        default: report

permissions:
  contents: read
  id-token: write

jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: alexei-led/archfit-action@2221f4bfece0725a657414fed751cdc090ba1bd4 # v3.1.1
        with:
          endpoint: "https://app.coupling.dev"
          audience: "https://app.coupling.dev"
          mode: ${{ inputs.mode }}
