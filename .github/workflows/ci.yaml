name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # persist-credentials:false: govulncheck-action runs a nested checkout;
      # a persisted auth extraheader here collides with it (duplicate
      # Authorization header -> HTTP 400). This job never pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
  # Pins and workflow syntax rot silently: a bad SHA or a renamed input
  # fails only when the job that uses it runs. This job lints the workflow
  # files themselves, including the SHA pins Dependabot updates.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: make workflows
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install architecture analyzers
        # Versions are pinned and the commands exercise Archfit's real adapters.
        # zizmor: ignore[adhoc-packages]
        run: |
          # Precautionary, not a fix for a known break: util-linux ships
          # /usr/bin/sg (a setgid helper) and the @ast-grep/cli postinstall
          # cannot overwrite that path (EEXIST). On this runner npm's global bin
          # precedes /usr/bin so `sg` already resolved to ast-grep — the gate
          # step below proves it — but the ordering is the runner image's
          # choice, not ours. The Dockerfile frees the slot for the same reason.
          sudo rm -f /usr/bin/sg
          npm install -g jscpd@5.0.11 @ast-grep/cli@0.44.0 dependency-cruiser@17.4.3
          rustup toolchain install 1.98.0 --profile minimal
          go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run tests
        env:
          ARCHFIT_REQUIRE_TOOLS: "1"
        run: go test -race -coverprofile=coverage.out ./...
      - name: SCIP reader tests (python)
        run: python3 internal/extract/scip/scip_reader_test.py
      - name: Corpus sweep harness tests (python)
        run: uv run --with jsonschema==4.26.0 python -m unittest discover -s scripts/eval -p '*_test.py'
      - name: CLI exit-contract tests (shell)
        run: bash scripts/tests/cli_exit_contract_test.sh
      - name: CI gate — arch imports
        run: go test ./internal/ -run TestArchImports
      - name: CI gate — model kernel surface (compat contract)
        run: go test ./internal/ -run TestModelSurfaceNoDrift
      - name: CI gate — golden output
        run: go test ./internal/application/ -run TestGolden
      # Erosion gates for the architecture-state contract. Named checks:
      # no_scalar_decision, no_dead_archfit_rule (internal/erosion_test.go);
      # dimension_status_required, config_hash_required, label_evidence_required,
      # baseline_idempotent (cmd/archfit/erosion_test.go); policy_query_agreement
      # (cmd/archfit/policy_test.go, policy_agreement_lang_test.go).
      - name: CI gate — architecture-state erosion
        env:
          ARCHFIT_REQUIRE_TOOLS: "1"
        run: go test ./internal/ ./cmd/archfit/ -run TestErosion_ -count=1
      - name: CI gate — `sg` resolves to ast-grep, not util-linux
        # A silent analyzer is worse than a missing one: the coverage row still
        # names a tool, so nothing looks wrong. This is the check that answers
        # "which sg ran" instead of leaving it to be inferred from a missing
        # version string.
        run: |
          echo "sg -> $(command -v sg)"
          sg --version
          sg --version 2>&1 | grep -q ast-grep
      - name: CI gate — real supported-language contracts
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: make language-contracts
      - name: CI gate — architecture drift
        run: make arch-lint
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
  python-image:
    name: Python 3.14 image contract
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build local image without publishing
        run: |
          docker build --tag archfit-python-ci \
            --build-arg VERSION=ci-python-smoke \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "DATE=$(sh scripts/build-meta.sh date)" .
      - name: Verify src-layout Python 3.14 evidence inside the image
        run: |
          output="${RUNNER_TEMP}/archfit-python-image"
          mkdir -p "$output"
          docker image inspect archfit-python-ci > "$output/image.json"
          status=0
          docker run --rm --read-only --tmpfs /tmp:rw,exec,nosuid,size=512m,mode=1777 \
            --env HOME=/tmp \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/testdata/python314,target=/src,readonly" \
            archfit-python-ci check --root /src --config /src/.archfit.yaml --json \
            > "$output/report.json" 2> "$output/stderr.log" || status=$?
          cat "$output/stderr.log"
          test "$status" -eq 1
          jq -e '
            .decision.hard_gates == "fail" and
            ((.decision.unevaluated_required_rules // []) | length == 0) and
            (.coverage.tools | any(.tool == "grimp" and .status == "ok")) and
            (.comparison.measurement_profile.producers | any(
              .tool == "grimp" and .semantics_version == "grimp.v3" and
              (.tool_version | contains("; python 3.14.")))) and
            (.findings | any(.rule_id == "no-core-to-adapter" and .kind == "gate"))
          ' "$output/report.json"
      - name: Preserve image and report evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-image-contract
          path: ${{ runner.temp }}/archfit-python-image
          retention-days: 7
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev} -X main.commit=$(sh scripts/build-meta.sh commit) -X main.date=$(sh scripts/build-meta.sh date)" \
            -o "dist/archfit-${GOOS}-${GOARCH}" \
            ./cmd/archfit
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
