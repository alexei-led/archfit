name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Locked tool manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.pins.outputs.go }}
      python: ${{ steps.pins.outputs.python }}
      uv: ${{ steps.pins.outputs.uv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify locks and read runtime pins
        id: pins
        run: |
          python3 scripts/provision_tools.py check
          python3 -m unittest discover -s scripts/tests -p '*_test.py'
          jq -r '.versions | to_entries[] | "\(.key)=\(.value)"' tools/manifest.json >> "$GITHUB_OUTPUT"
  lint:
    name: Lint
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # persist-credentials:false: govulncheck-action runs a nested checkout;
      # a persisted auth extraheader here collides with it (duplicate
      # Authorization header -> HTTP 400). This job never pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.tools.outputs.go }}
          check-latest: false
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ needs.tools.outputs.go }}
          cache: false
  # Pins and workflow syntax rot silently: a bad SHA or a renamed input
  # fails only when the job that uses it runs. This job lints the workflow
  # files themselves, including the SHA pins Dependabot updates.
  workflows:
    name: Workflows
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.tools.outputs.go }}
          check-latest: false
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ needs.tools.outputs.python }}
          version: ${{ needs.tools.outputs.uv }}
          enable-cache: false
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: make workflows
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs:
      - lint
      - tools
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.tools.outputs.go }}
          check-latest: false
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ needs.tools.outputs.python }}
          version: ${{ needs.tools.outputs.uv }}
          enable-cache: false
      - name: Install locked native architecture analyzers
        run: bash scripts/ci-provision-tools.sh
      - name: Run tests
        env:
          ARCHFIT_REQUIRE_TOOLS: "1"
        run: go test -race -coverprofile=coverage.out ./...
      - name: SCIP reader tests (python)
        run: '"$ARCHFIT_TOOL_PYTHON" -I internal/extract/scip/scip_reader_test.py'
      - name: Corpus sweep harness tests (python)
        run: uv run --with jsonschema==4.26.0 python -m unittest discover -s scripts/eval -p '*_test.py'
      - name: CLI exit-contract tests (shell)
        run: bash scripts/tests/cli_exit_contract_test.sh
      - name: CI gate — arch imports
        run: go test ./internal/ -run TestArchImports
      - name: CI gate — model kernel surface (compat contract)
        run: go test ./internal/ -run TestModelSurfaceNoDrift
      - name: CI gate — golden output
        run: go test ./internal/application/ -run TestGolden
      # Erosion gates for the architecture-state contract. Named checks:
      # no_scalar_decision, no_dead_archfit_rule (internal/erosion_test.go);
      # dimension_status_required, config_hash_required, label_evidence_required,
      # baseline_idempotent (cmd/archfit/erosion_test.go); policy_query_agreement
      # (cmd/archfit/policy_test.go, policy_agreement_lang_test.go).
      - name: CI gate — architecture-state erosion
        env:
          ARCHFIT_REQUIRE_TOOLS: "1"
        run: go test ./internal/ ./cmd/archfit/ -run TestErosion_ -count=1
      - name: CI gate — `sg` resolves to ast-grep, not util-linux
        # A silent analyzer is worse than a missing one: the coverage row still
        # names a tool, so nothing looks wrong. This is the check that answers
        # "which sg ran" instead of leaving it to be inferred from a missing
        # version string.
        run: |
          echo "sg -> $(command -v sg)"
          sg --version
          sg --version 2>&1 | grep -q ast-grep
      - name: CI gate — real supported-language contracts
        run: make language-contracts
      - name: CI gate — architecture drift
        run: make arch-lint
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
  image:
    name: Complete image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - lint
      - tools
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build native local image without publishing
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --platform "$PLATFORM" --tag archfit-upgrade-image:ci \
            --build-arg VERSION=ci-image-contract \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "DATE=$(sh scripts/build-meta.sh date)" .
      - name: Full real-language final-image contracts
        run: |
          python3 scripts/image_contracts.py --docker-context default \
            --image archfit-upgrade-image:ci --output-dir "$RUNNER_TEMP/archfit-image-contract"
      - name: Preserve image and report evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-contract-${{ matrix.runner }}
          path: ${{ runner.temp }}/archfit-image-contract
          retention-days: 7
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs:
      - test
      - tools
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.tools.outputs.go }}
          check-latest: false
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev} -X main.commit=$(sh scripts/build-meta.sh commit) -X main.date=$(sh scripts/build-meta.sh date)" \
            -o "dist/archfit-${GOOS}-${GOARCH}" \
            ./cmd/archfit
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
