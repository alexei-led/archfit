name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials:false: govulncheck-action runs a nested checkout;
      # a persisted auth extraheader here collides with it (duplicate
      # Authorization header -> HTTP 400). This job never pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
      - name: govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-file: go.mod
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: SCIP reader tests (python)
        run: python3 internal/extract/scip/scip_reader_test.py
      - name: Corpus sweep harness tests (python)
        run: python3 scripts/eval/corpus_sweep_test.py
      - name: CLI exit-contract tests (shell)
        run: bash scripts/tests/cli_exit_contract_test.sh
      - name: CI gate — arch imports
        run: go test ./internal/ -run TestArchImports
      - name: CI gate — model kernel surface (compat contract)
        run: go test ./internal/ -run TestModelSurfaceNoDrift
      - name: CI gate — golden output
        run: go test ./internal/application/ -run TestGolden
      # Erosion gates for the architecture-state contract. Named checks:
      # no_scalar_decision, no_dead_archfit_rule (internal/erosion_test.go);
      # dimension_status_required, config_hash_required, label_evidence_required,
      # baseline_idempotent (cmd/archfit/erosion_test.go).
      - name: CI gate — architecture-state erosion
        run: go test ./internal/ ./cmd/archfit/ -run TestErosion_ -count=1
      - name: Install architecture analyzers
        # Versions are pinned and the commands exercise Archfit's real adapters.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install -g jscpd@5.0.11 @ast-grep/cli@0.44.0
          go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: CI gate — architecture drift
        run: make arch-lint
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}" \
            -o "dist/archfit-${GOOS}-${GOARCH}" \
            ./cmd/archfit
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
