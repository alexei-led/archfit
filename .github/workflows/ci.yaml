name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every job reads its runtime versions straight from tools/manifest.json, so no
  # job waits behind a barrier. The locks themselves are checked in Lint, which is
  # a required check.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # persist-credentials:false: govulncheck-action runs a nested checkout;
      # a persisted auth extraheader here collides with it (duplicate
      # Authorization header -> HTTP 400). This job never pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read runtime pins
        id: pins
        run: jq -r '.versions | to_entries[] | "\(.key)=\(.value)"' tools/manifest.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.pins.outputs.go }}
          check-latest: false
          cache: false
      # Scoped Go cache: setup-go saves only on a miss, so a shared key
      # freezes whatever the first finisher built and makes the rest rebuild.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.work.sum') }}-lint
      # The manifest lock check used to gate every job behind a barrier job. It
      # only has to fail the merge, and Lint is a required check.
      - name: Locked tool manifest
        run: make tool-locks
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.pins.outputs.go }}
          cache: false
  # Pins and workflow syntax rot silently: a bad SHA or a renamed input
  # fails only when the job that uses it runs. This job lints the workflow
  # files themselves, including the SHA pins Dependabot updates.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read runtime pins
        id: pins
        run: jq -r '.versions | to_entries[] | "\(.key)=\(.value)"' tools/manifest.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.pins.outputs.go }}
          check-latest: false
          cache: false
      # Scoped Go cache: setup-go saves only on a miss, so a shared key
      # freezes whatever the first finisher built and makes the rest rebuild.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.work.sum') }}-workflows
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.pins.outputs.python }}
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: false
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: make workflows
  # The suite is 396s of measured package time on a 4-vCPU runner and three
  # packages are two thirds of it, so one shard per long pole beats one big job.
  # scripts/ci_test_shards.py assigns packages; the `test` job below keeps the
  # required check name stable across the matrix.
  test-shard:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read runtime pins
        id: pins
        run: jq -r '.versions | to_entries[] | "\(.key)=\(.value)"' tools/manifest.json >> "$GITHUB_OUTPUT"
      # No setup-go: the restored toolchain carries the pinned Go, which is what
      # the image ships as well.
      # One Go cache entry per shard. A shared key is not usable here: the cache
      # saves only on a miss, so the first shard to finish freezes the entry and
      # the others recompile every test binary they own on every run.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.work.sum') }}-shard-${{ matrix.shard }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.pins.outputs.python }}
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: false
      # The analyzer toolchain costs minutes to build (cargo-modules compiles from
      # source) and is identical for every job that needs it. The key covers every
      # lock the provisioners read, so a pin change re-provisions and a code change
      # reuses the restored tree.
      - name: Restore locked analyzer toolchain
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/archfit
          key: archfit-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**', 'scripts/provision_tools.py', 'scripts/provision-analyzers.sh', 'scripts/ci-provision-tools.sh') }}
      - name: Provision locked analyzer toolchain
        env:
          ARCHFIT_PREFIX: ${{ runner.temp }}/archfit
          ARCHFIT_TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain.outputs.cache-hit }}
        run: bash scripts/ci-provision-tools.sh
      - name: Save locked analyzer toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/archfit
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Run tests
        env:
          ARCHFIT_REQUIRE_TOOLS: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        run: |
          go list ./... | python3 scripts/ci_test_shards.py --shard "$SHARD" --total "$SHARDS" >"$RUNNER_TEMP/packages.txt"
          mapfile -t packages <"$RUNNER_TEMP/packages.txt"
          test "${#packages[@]}" -gt 0
          go test -race -coverprofile="coverage-$SHARD.out" "${packages[@]}"
      # One shard runs the non-Go contract tests: they are separate programs, not
      # package tests, and would otherwise run three times over.
      - name: SCIP reader tests (python)
        if: matrix.shard == 1
        run: '"$ARCHFIT_TOOL_PYTHON" -I internal/extract/scip/scip_reader_test.py'
      - name: Corpus sweep harness tests (python)
        if: matrix.shard == 1
        run: uv run --with jsonschema==4.26.0 python -m unittest discover -s scripts/eval -p '*_test.py'
      - name: CLI exit-contract tests (shell)
        if: matrix.shard == 1
        run: bash scripts/tests/cli_exit_contract_test.sh
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          retention-days: 7
  # Required check name. Branch protection only names `Test`, so the shard
  # matrix reports through this single job.
  test:
    name: Test
    needs: [test-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "test shards: $RESULT" >&2
            exit 1
          fi

  # The architecture-state gates used to run after the whole suite inside Test,
  # which put two minutes of real-tool contracts on the merge critical path for
  # no reason: they share nothing with the Go tests but the toolchain.
  gates:
    name: Architecture gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read runtime pins
        id: pins
        run: jq -r '.versions | to_entries[] | "\(.key)=\(.value)"' tools/manifest.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.pins.outputs.go }}
          check-latest: false
          cache: false
      # Scoped Go cache: setup-go saves only on a miss, so a shared key
      # freezes whatever the first finisher built and makes the rest rebuild.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.work.sum') }}-gates
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.pins.outputs.python }}
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: false
      - name: Restore locked analyzer toolchain
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/archfit
          key: archfit-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**', 'scripts/provision_tools.py', 'scripts/provision-analyzers.sh', 'scripts/ci-provision-tools.sh') }}
      - name: Provision locked analyzer toolchain
        env:
          ARCHFIT_PREFIX: ${{ runner.temp }}/archfit
          ARCHFIT_TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain.outputs.cache-hit }}
        run: bash scripts/ci-provision-tools.sh
      - name: Save locked analyzer toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/archfit
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: CI gate — `sg` resolves to ast-grep, not util-linux
        # A silent analyzer is worse than a missing one: the coverage row still
        # names a tool, so nothing looks wrong. This is the check that answers
        # "which sg ran" instead of leaving it to be inferred from a missing
        # version string.
        run: |
          echo "sg -> $(command -v sg)"
          sg --version
          sg --version 2>&1 | grep -q ast-grep
      - name: CI gate — arch imports
        run: go test ./internal/ -run TestArchImports
      - name: CI gate — model kernel surface (compat contract)
        run: go test ./internal/ -run TestModelSurfaceNoDrift
      - name: CI gate — golden output
        run: go test ./internal/application/ -run TestGolden
      # Erosion gates for the architecture-state contract. Named checks:
      # no_scalar_decision, no_dead_archfit_rule (internal/erosion_test.go);
      # dimension_status_required, config_hash_required, label_evidence_required,
      # baseline_idempotent (cmd/archfit/erosion_test.go); policy_query_agreement
      # (cmd/archfit/policy_test.go, policy_agreement_lang_test.go).
      - name: CI gate — architecture-state erosion
        env:
          ARCHFIT_REQUIRE_TOOLS: "1"
        run: go test ./internal/ ./cmd/archfit/ -run TestErosion_ -count=1
      - name: CI gate — real supported-language contracts
        run: make language-contracts
      - name: CI gate — architecture drift
        run: make arch-lint
  image:
    name: Complete image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build metadata
        id: meta
        run: echo "date=$(sh scripts/build-meta.sh date)" >> "$GITHUB_OUTPUT"
      # The tools-builder stage is the same toolchain the Test job provisions and
      # caches; mode=max keeps that layer, so an unchanged tools/ tree reuses it.
      - name: Build native local image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: archfit-upgrade-image:ci
          provenance: false
          cache-from: type=gha,scope=ci-image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.platform }}
          build-args: |
            VERSION=ci-image-contract
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Full real-language final-image contracts
        run: |
          python3 scripts/image_contracts.py --docker-context default \
            --image archfit-upgrade-image:ci --output-dir "$RUNNER_TEMP/archfit-image-contract"
      - name: Preserve image and report evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-contract-${{ matrix.runner }}
          path: ${{ runner.temp }}/archfit-image-contract
          retention-days: 7
  # Cross-compilation reads no test output, so it does not wait for Test.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read runtime pins
        id: pins
        run: jq -r '.versions | to_entries[] | "\(.key)=\(.value)"' tools/manifest.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.pins.outputs.go }}
          check-latest: false
          cache: false
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev} -X main.commit=$(sh scripts/build-meta.sh commit) -X main.date=$(sh scripts/build-meta.sh date)" \
            -o "dist/archfit-${GOOS}-${GOARCH}" \
            ./cmd/archfit
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/archfit-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
