name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v*-rc.*
jobs:
  build-binaries:
    name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:?}" \
            -o "dist/archfit-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/archfit
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-docker:
    name: Merge Docker manifest
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Create multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -printf "%f\n" | sed "s|^|${IMAGE}@sha256:|")

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${DIGESTS[@]}"
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Release waits for binaries and the multi-arch image so both publish together.
    needs:
      - build-binaries
      - merge-docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: binary-*
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum archfit-* > SHA256SUMS
      - name: Generate release notes
        run: |
          TAG="${{ github.ref_name }}"
          # actions/checkout writes the triggering tag as a lightweight ref,
          # dropping the annotation, so re-fetch the annotated tag object. Its
          # message is the curated release notes; %(contents) is empty for a
          # lightweight tag, which triggers the commit-log fallback below.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          git for-each-ref "refs/tags/${TAG}" --format='%(contents)' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
            if [ -n "${PREV_TAG}" ]; then
              git log --oneline "${PREV_TAG}..HEAD" > RELEASE_NOTES.md
            else
              git log --oneline > RELEASE_NOTES.md
            fi
          fi
      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '\-rc\.'; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --notes-file RELEASE_NOTES.md \
            ${{ steps.prerelease.outputs.flag }} \
            dist/*
