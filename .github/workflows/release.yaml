name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v*-rc.*
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-binaries:
    name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:?}" \
            -o "dist/archfit-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}" \
            ./cmd/archfit
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # publish per-platform image digests to GHCR
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-docker:
    name: Merge Docker manifest
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      packages: write # assemble and publish the multi-architecture GHCR manifest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Create multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -printf "%f\n" | sed "s|^|${IMAGE}@sha256:|")

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${DIGESTS[@]}"
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Release waits for binaries and the multi-arch image so both publish together.
    needs:
      - build-binaries
      - merge-docker
    permissions:
      contents: write # create the GitHub Release and attach verified binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
          pattern: binary-*
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum archfit-* > SHA256SUMS
      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # actions/checkout writes the triggering tag as a lightweight ref,
          # dropping the annotation, so re-fetch the annotated tag object. Its
          # message is the curated release notes; %(contents) is empty for a
          # lightweight tag, which triggers the commit-log fallback below.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          git for-each-ref "refs/tags/${TAG}" --format='%(contents)' \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
            if [ -n "${PREV_TAG}" ]; then
              git log --oneline "${PREV_TAG}..HEAD" > RELEASE_NOTES.md
            else
              git log --oneline > RELEASE_NOTES.md
            fi
          fi
      - name: Detect pre-release
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if echo "$TAG" | grep -qE '\-rc\.'; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: ${{ steps.prerelease.outputs.flag }}
          TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            args+=("$PRERELEASE_FLAG")
          fi
          gh release create "$TAG" \
            --notes-file RELEASE_NOTES.md \
            "${args[@]}" \
            dist/*
  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    # Isolated from the release job: the GitHub release, binaries, and image are
    # already published by the time this runs. Skipped for pre-releases.
    needs: release
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch SHA256SUMS from release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -sL -f \
            "https://github.com/alexei-led/archfit/releases/download/${TAG}/SHA256SUMS" \
            -o SHA256SUMS
      - name: Generate formula
        run: |
          ruby scripts/update_homebrew_formula.rb "${GITHUB_REF_NAME#v}" SHA256SUMS > archfit.rb
          cat archfit.rb
      - name: Push to homebrew-tap
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/alexei-led/homebrew-tap.git" \
            tap
          cp archfit.rb tap/Formula/archfit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/archfit.rb
          git commit -m "archfit ${GITHUB_REF_NAME#v}"
          git push
