name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v*-rc.*
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-binaries:
    name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:?} -X main.commit=$(sh scripts/build-meta.sh commit) -X main.date=$(sh scripts/build-meta.sh date)" \
            -o "dist/archfit-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}" \
            ./cmd/archfit
      - name: Check version string
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out="$("dist/archfit-${GITHUB_REF_NAME}-linux-amd64" --version)"
          echo "$out"
          case "$out" in *"commit none"* | *"built unknown"* | *"commit ,"* | *"built )"*) echo "version string lacks build metadata" >&2; exit 1 ;; esac
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publish per-platform image digests to GHCR
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build metadata
        id: meta
        run: |
          echo "commit=$(sh scripts/build-meta.sh commit)" >> "$GITHUB_OUTPUT"
          echo "date=$(sh scripts/build-meta.sh date)" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Verify the immutable platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          output="${RUNNER_TEMP}/archfit-release-image"
          mkdir -p "$output"
          docker pull "$image"
          docker image inspect "$image" > "$output/image.json"
          docker run --rm "$image" --version > "$output/version.txt"
          grep -F "archfit version ${TAG} (commit ${COMMIT}," "$output/version.txt"
          status=0
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,exec,nosuid,size=512m,mode=1777 \
            --env HOME=/tmp \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/testdata/python314,target=/src,readonly" \
            "$image" check --root /src --config /src/.archfit.yaml --json \
            > "$output/report.json" 2> "$output/stderr.log" || status=$?
          cat "$output/stderr.log"
          test "$status" -eq 1
          jq -e '
            .decision.hard_gates == "fail" and
            ((.decision.unevaluated_required_rules // []) | length == 0) and
            (.coverage.tools | any(.tool == "grimp" and .status == "ok")) and
            (.comparison.measurement_profile.producers | any(
              .tool == "grimp" and .semantics_version == "grimp.v3" and
              (.tool_version | startswith("grimp 3.17; python 3.14.")))) and
            (.findings | any(.rule_id == "no-core-to-adapter" and .kind == "gate"))
          ' "$output/report.json"
      - name: Preserve platform smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-contract-${{ matrix.runner }}
          path: ${{ runner.temp }}/archfit-release-image
          retention-days: 7
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-docker:
    name: Merge Docker manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-docker
    permissions:
      packages: write # assemble and publish the multi-architecture GHCR manifest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Create multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -printf "%f\n" | sed "s|^|${IMAGE}@sha256:|")

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${DIGESTS[@]}"
      # The App's locked manifest pins the engine by per-platform digest. Read
      # them back from the published index so the release carries the exact
      # values instead of someone copying them by hand.
      - name: Record image identity
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/identity
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' \
            | jq --arg image "$IMAGE" --arg version "$TAG" '{
                schema_version: "archfit.image-identity.v1",
                engine_version: $version,
                image: $image,
                index_digest: .digest,
                platforms: ([.manifests[]
                  | select(.platform.os != "unknown")
                  | {platform: "\(.platform.os)/\(.platform.architecture)", digest: .digest}]
                  | sort_by(.platform))
              }' > /tmp/identity/image-identity.json
          jq -e '(.index_digest | test("^sha256:[0-9a-f]{64}$"))
                 and (.platforms | length) == 2
                 and all(.platforms[]; .digest | test("^sha256:[0-9a-f]{64}$"))' \
            /tmp/identity/image-identity.json
          cat /tmp/identity/image-identity.json
      - name: Upload image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-identity
          path: /tmp/identity/image-identity.json
          if-no-files-found: error
          retention-days: 1
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Release waits for binaries and the multi-arch image so both publish together.
    needs:
      - build-binaries
      - merge-docker
    permissions:
      contents: write # create the GitHub Release and attach verified binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist/
          pattern: binary-*
          merge-multiple: true
      - name: Download image identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-identity
          path: dist/
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum archfit-* > SHA256SUMS
      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # actions/checkout writes the triggering tag as a lightweight ref,
          # dropping the annotation, so re-fetch the annotated tag object. Its
          # message is the curated release notes; %(contents) is empty for a
          # lightweight tag, which triggers the commit-log fallback below.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          git for-each-ref "refs/tags/${TAG}" --format='%(contents)' \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
            if [ -n "${PREV_TAG}" ]; then
              git log --oneline "${PREV_TAG}..HEAD" > RELEASE_NOTES.md
            else
              git log --oneline > RELEASE_NOTES.md
            fi
          fi
      - name: Detect pre-release
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if echo "$TAG" | grep -qE '\-rc\.'; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: ${{ steps.prerelease.outputs.flag }}
          TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            args+=("$PRERELEASE_FLAG")
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            "${args[@]}" \
            dist/*
  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    # Isolated from the release job: the GitHub release, binaries, and image are
    # already published by the time this runs. Skipped for pre-releases.
    needs: release
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch SHA256SUMS from release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -sL -f \
            "https://github.com/alexei-led/archfit/releases/download/${TAG}/SHA256SUMS" \
            -o SHA256SUMS
      - name: Generate formula
        run: |
          ruby scripts/update_homebrew_formula.rb "${GITHUB_REF_NAME#v}" SHA256SUMS > archfit.rb
          cat archfit.rb
      - name: Push to homebrew-tap
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/alexei-led/homebrew-tap.git" \
            tap
          cp archfit.rb tap/Formula/archfit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/archfit.rb
          git commit -m "archfit ${GITHUB_REF_NAME#v}"
          git push
