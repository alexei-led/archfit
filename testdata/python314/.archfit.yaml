version: 3
owners:
  - alexei-led
modules:
  core:
    paths: [src/modern314/core.py]
  adapter:
    paths: [src/modern314/adapter.py]
rules:
  - id: no-core-to-adapter
    deny: {from: [core], to: [adapter]}
    why: The adapter sits outside the core; a core import of it inverts the dependency.
    instead: Pass the value in from the adapter, or move the shared code into the core.
exclude:
  - src/modern314/__init__.py
  - src/modern314/_version.py
languages:
  python:
    enabled: true
    package: modern314
