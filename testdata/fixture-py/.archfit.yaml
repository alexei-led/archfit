version: 1
# Python module globs MUST be in DOTTED module form (grimp emits dotted node IDs
# like "fixture_py.b._internal.impl"), NOT file paths. paths:/public:/internal:
# and rule from:/to: all match against the dotted node ID. See
# internal/config/config_test.go:TestModuleFor_PythonDottedGlobs and CLAUDE.md.
modules:
  a:
    paths:
      - fixture_py.a
  b:
    paths:
      - fixture_py.b
      - fixture_py.b.**
    public:
      - fixture_py.b
    internal:
      - fixture_py.b._internal.*
rules:
  - id: no_internal_access
    type: forbidden_dependency
    gate: fail
    from: fixture_py.a
    to: fixture_py.b._internal.*
