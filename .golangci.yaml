version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused
    - gocritic
    - gocyclo
    - goconst
    - gosec
    - prealloc
    - unconvert
    - unparam
    - nolintlint
    - misspell
    - whitespace
    - errorlint
    - perfsprint
    - usestdlibvars
  exclusions:
    paths:
      - mocks
      - testdata
    rules:
      # SA5011 false-positives in tests: `if x == nil { t.Fatalf(...) }` guards are
      # safe (t.Fatalf terminates the goroutine), but staticcheck does not always
      # treat t.Fatalf as no-return, so it warns about the following deref. A nil
      # deref in a test panics and fails the test anyway, so exclude it there.
      - path: _test\.go
        linters:
          - staticcheck
        text: SA5011
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alexei-led/archfit
