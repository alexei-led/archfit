rules:
  - id: core_no_toolrun
    deny:
      from:
        - internal/relationship/**
      to:
        - internal/toolrun/*
    why: Core that runs processes cannot be tested without the tool and cannot say which evidence is missing, so the verdict starts to depend on the host.
    instead: Consume the neutral evidence contract in internal/model/evidence and internal/evidence; the tool run belongs in an extractor adapter, not in this package
  - id: assessment_no_toolrun
    deny:
      from:
        - internal/assessment/**
      to:
        - internal/toolrun/*
    why: Assessment that spawns tools makes the verdict depend on the tools installed on the host instead of on the evidence it was given.
    instead: Consume the neutral evidence contract in internal/model/evidence and internal/evidence; the tool run belongs in an extractor adapter, not in this package
  - id: core_no_extract
    deny:
      from:
        - internal/relationship/**
      to:
        - internal/extract/**
    why: Core importing an extractor ties relationship analysis to one language producer; a second producer or a test fixture can no longer replace it.
    instead: Consume the neutral evidence contract in internal/model/evidence and internal/evidence
  - id: assessment_no_extract
    deny:
      from:
        - internal/assessment/**
      to:
        - internal/extract/**
    why: Assessment reading extractor output decides on tool-specific facts, so the same rule gives different verdicts per producer.
    instead: Consume the neutral evidence contract in internal/model/evidence and internal/evidence
  - id: internal_no_labelsio
    deny:
      from:
        - internal/**
      to:
        - internal/labels/labelsio/**
    why: Label files load in cmd only. Library code that reads them makes the verdict depend on a file nobody passed in, and unapproved labels can reach the gate.
    instead: Load labels in cmd/archfit and pass approved values through internal/relationship/labels.
  - id: assessment_no_coupling_internals
    deny:
      from:
        - internal/assessment/**
      to:
        - internal/relationship/coupling/**
    why: Assessment that reads coupling internals re-derives relationship meaning. Two owners of classification disagree, and the verdict contradicts the report.
    instead: Use the public relationship contract in internal/relationship
  - id: assessment_no_raw_graph
    deny:
      from:
        - internal/assessment/**
      to:
        - internal/model/graph/**
    why: A rule that reads the raw dependency graph bypasses relationship classification. A changed extractor shape then breaks rules, and one edge is judged two ways.
    instead: Use the public relationship contract in internal/relationship
  - id: relationship_no_assessment
    deny:
      from:
        - internal/relationship/**
      to:
        - internal/assessment/**
    why: "Relationship analysis importing assessment reverses the data flow into a cycle: classification would start to depend on rules and verdicts."
    instead: Return relationship facts through internal/relationship for internal/assessment to evaluate.
  - id: assessment_no_report_dtos
    deny:
      from:
        - internal/assessment/**
      to:
        - internal/model/report/**
    why: Report DTOs are the output contract. Assessment importing them couples verdict logic to the wire format, so a schema change rewrites decisions.
    instead: Return a domain value and let internal/application/report.go project it into the report
  - id: relationship_no_report_dtos
    deny:
      from:
        - internal/relationship/**
      to:
        - internal/model/report/**
    why: Report DTOs are the output contract. Relationship analysis importing them couples classification to the wire format, so a schema change rewrites relationship facts.
    instead: Return a domain value and let internal/application/report.go project it into the report
  - id: assessment_no_relationship_internals
    deny:
      from:
        - internal/assessment/**
      to:
        - internal/relationship/{classify,scoring,coupling,facts,labels,analysis}/**
    why: Assessment must read the public relationship contract. Depending on a classifier or scorer package freezes its internals, and a refactor there changes verdicts.
    instead: Use the public relationship contract in internal/relationship
  - id: acquisition_no_assessment_judgment
    deny:
      from:
        - internal/evidence/**
      to:
        - internal/assessment/{status,staleness,finding,rules,metrics,decision,agenttask}/**
    why: Acquisition observes and never judges. A judgment here creates a second owner of rules and findings, and the verdict then depends on how evidence was collected.
    instead: Return the observation and let internal/assessment decide through the evaluation port
  - id: report_adapters_no_application
    deny:
      from:
        - internal/output/**
      to:
        - internal/application/**
    why: Renderers read report DTOs only. Importing application lets a renderer re-run or reinterpret a result, so two formats can disagree about one run.
    instead: Read the value from the report DTOs in internal/model/report
  - id: renderer_no_assessment
    deny:
      from:
        - internal/output/**
      to:
        - internal/assessment/**
    why: A renderer that reads assessment types can decide for itself. Text, JSON and SARIF would then report different answers for one run.
    instead: Read the value from the report DTOs in internal/model/report; add it to the projection in internal/application/report.go
  - id: renderer_no_relationship
    deny:
      from:
        - internal/output/**
      to:
        - internal/relationship/**
    why: A renderer must not reclassify relationships. A second classification path makes the report contradict the verdict.
    instead: Read the value from the report DTOs in internal/model/report; add it to the projection in internal/application/report.go
  - id: renderer_no_evidence
    deny:
      from:
        - internal/output/**
      to:
        - internal/evidence/**
    why: A renderer shows what was measured. Reading raw evidence lets a format claim facts the verdict never used.
    instead: Read the value from the report DTOs in internal/model/report; add it to the projection in internal/application/report.go
  - id: projector_no_domain_internals
    deny:
      from:
        - internal/application/report.go
      to:
        - internal/{relationship,evidence}/**
    why: The projector copies decided values into report DTOs. Reaching into relationship or evidence internals rebuilds a decision inside the projection, where no rule test guards it.
    instead: Project decided values from internal/application into internal/model/report.
  - id: evidence_no_policy
    deny:
      from:
        - internal/evidence/*.go
      to:
        - internal/policy/**
    why: The evidence contract carries facts. A policy import means the tool boundary has started to decide architecture, and evidence stops being comparable across configs.
    instead: Keep observations in internal/model/evidence and policy decisions in internal/policy.
  - id: no_stage_view
    note: "No dependency from internal/** to internal/view/**. Archfit 3 named instead: Put the contract in the capability that decides it"
    why: A shared stage-view package re-creates the hub every stage depends on, and the capability owners lose their contracts.
  - id: output_no_score
    deny:
      from:
        - internal/output/**
      to:
        - internal/assessment/score/**
    why: Renderers bound to the scorer re-derive scores per format, and a scalar leaks into a decision that is made from hard gates.
    instead: Read the value from the report DTOs in internal/model/report
  - id: assessment_no_score_decision
    deny:
      from:
        - internal/assessment/state/**
      to:
        - internal/assessment/score/**
    why: The architecture decision comes from hard gates and finding classes, never from an averaged score. If the state package can reach the scorer, a metric can silently decide the verdict.
    instead: Use hard-gate decisions from internal/assessment/decision in internal/assessment/state.
  - id: application_no_concrete_adapters
    deny:
      from:
        - internal/application/**
      to:
        - internal/{extract,toolrun,output}/**
    why: The application states its needs as ports. A concrete extractor, tool runner or renderer inside it cannot be swapped or faked, and its tests need the real tools.
    instead: Declare the need as a port in internal/application and wire the adapter in cmd/archfit
  - id: application_no_evidence_acquisition
    deny:
      from:
        - internal/application/**
      to:
        - internal/evidence/acquisition/**
    why: The application sequences stages through the evidence port. Importing the acquisition service ties the use case to one concrete collector.
    instead: Declare the need as a port in internal/application and wire the adapter in cmd/archfit
  - id: application_no_factcache
    deny:
      from:
        - internal/application/**
      to:
        - internal/factcache/**
    why: The fact cache is an adapter. Application code that imports it hides cache effects inside use-case logic, and a stale cache can change a verdict unseen.
    instead: Declare the need as a port in internal/application and wire the adapter in cmd/archfit
  - id: application_no_persistence_adapters
    deny:
      from:
        - internal/application/**
      to:
        - internal/history/**
    why: History readers are adapters. Application code that imports git history ties the use case to git and breaks fixtures.
    instead: Declare the need as a port in internal/application and wire the adapter in cmd/archfit
  - id: application_no_ownership
    deny:
      from:
        - internal/application/**
      to:
        - internal/ownership/**
    why: Ownership readers are adapters. Application code that imports them ties the use case to CODEOWNERS and git.
    instead: Declare the need as a port in internal/application and wire the adapter in cmd/archfit
  - id: application_no_labelsio
    deny:
      from:
        - internal/application/**
      to:
        - internal/labels/labelsio/**
    why: Label files load in cmd only. An application import of the loader lets unreviewed labels reach the gate.
    instead: Declare the need as a port in internal/application and wire the adapter in cmd/archfit
  - id: application_no_cmd
    deny:
      from:
        - internal/application/**
      to:
        - cmd/archfit/**
    why: "Application importing cmd inverts the composition root: the library would depend on the CLI that wires it."
    instead: Define application ports in internal/application and wire them in cmd/archfit.
  - id: no_analysispipeline
    note: "No dependency from ** to internal/analysispipeline/**. Archfit 3 named instead: Give the stage to the capability that decides it; the application sequences the stages"
    why: The orchestration hub was removed. Reintroducing it puts stage ownership back in one place that decides everything.
  - id: core_no_cmd
    deny:
      from:
        - internal/{policy,relationship,assessment,evidence,model,scope,syntax}/**
      to:
        - cmd/**
    why: Core must not know the CLI. A core import of cmd makes a command impossible to replace and hides domain decisions in the composition root.
    instead: Keep domain behavior in internal/policy, internal/relationship or internal/assessment; wire it in cmd/archfit.
  - id: adapter_no_cli
    deny:
      from:
        - internal/{extract,toolrun,history,output,labels,factcache,ownership,config}/**
      to:
        - cmd/**
    why: "Adapters importing cmd invert the dependency: an adapter would depend on the command that selects it."
    instead: Keep adapter behavior in its internal package and wire it in cmd/archfit.
  - id: cli_no_domain_implementation
    deny:
      from:
        - cmd/archfit/**
      to:
        - internal/{assessment/rules,assessment/metrics,assessment/score,assessment/status,assessment/decision,assessment/finding,relationship/classify,relationship/scoring,relationship/coupling}/**
    why: A rule, metric, scorer, status, decision, finding or classifier in cmd is a second place where the verdict is decided, and it drifts from the assessment.
    instead: Call the application use case in internal/application
  - id: syntax_api_size_ceiling
    note: A module has at most 430 exported declarations.
    why: Archfit 3 checked this rule; Archfit 4 does not check it.
  - id: arch_public_api_type_leak
    note: The public part of a module does not expose a type from its inside.
    why: Archfit 3 checked this rule; Archfit 4 does not check it.
