version: 1
# Minimum severity for BC coupling advisories to appear in scan output.
# low: all cross-module deps (noisy for well-designed codebases)
# medium: only over-decoupled volatile seams and tight cross-boundary coupling
# high/critical: only intrusive or functional coupling across large boundaries
bc_advisory_min_severity: medium
# Enable book Ch9 inferred-volatility cascade: a module strongly coupled
# (strength ≥ functional) to a high-volatility module inherits raised effective
# volatility. Config-declared volatility always takes precedence and is never lowered.
volatility_cascade_enabled: true
# Architecture layers — innermost to outermost.
# forbidden_layer_direction fires when fromRank < toRank (inner imports outer).
layers:
  - model # rank 0: pure value types, stdlib only
  - support # rank 1: config, scope
  - core # rank 2: classify, rules, metrics, status
  - engine # rank 3: orchestration pipeline
  - adapter # rank 4: baseline, toolrun, extractors, renderers, git
  - cmd # rank 5: composition root
modules:
  internal/model:
    owner: alexei-led
    paths:
      - internal/model/**
    # public = the package paths themselves (not file paths)
    public:
      - internal/model/graph
      - internal/model/finding
      - internal/model/coupling
      - internal/model/diagnostic
      - internal/model/clone
      - internal/model/pattern
      - internal/model/signal
      - internal/model/symbol
    layer: model
    # Core domain model — these types evolve with every new feature (new
    # Diagnostic fields, graph node types, coupling constants). Volatile by
    # nature; book anchor core→V=10. No explicit volatility override.
    subdomain: core
  internal/config:
    owner: alexei-led
    paths:
      - internal/config/**
    public:
      - internal/config
    layer: support
    subdomain: supporting
    volatility: medium
  internal/baseline:
    owner: alexei-led
    paths:
      - internal/baseline/**
    public:
      - internal/baseline
    # Persistence (reads/writes the baseline file) — adapter, not support.
    # status consumes it through the status.AcceptedSet interface.
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/classify:
    owner: alexei-led
    paths:
      - internal/classify/**
    public:
      - internal/classify
    layer: core
    subdomain: core
    volatility: medium
  internal/rules:
    owner: alexei-led
    paths:
      - internal/rules/**
    public:
      - internal/rules
    layer: core
    subdomain: core
    volatility: medium
  internal/metrics:
    owner: alexei-led
    paths:
      - internal/metrics/**
    public:
      - internal/metrics
      - internal/metrics/boundary
      - internal/metrics/intramodule
      - internal/metrics/modularity
      - internal/metrics/risk
      - internal/metrics/metricstest
      - internal/metrics/internal/modgraph
      - internal/metrics/internal/result
    layer: core
    subdomain: core
    volatility: medium
  internal/status:
    owner: alexei-led
    paths:
      - internal/status/**
    public:
      - internal/status
    layer: core
    # AcceptedSet / AcceptedItem: stable infrastructure tracking baseline
    # exceptions, not domain logic. Supporting subdomain; low volatility
    # (stable since the decoupling refactor). Book anchor: supporting→V=3.
    subdomain: supporting
    volatility: low
  internal/engine:
    owner: alexei-led
    paths:
      - internal/engine/**
    public:
      - internal/engine
    layer: engine
    subdomain: core
    volatility: medium
  internal/scope:
    owner: alexei-led
    paths:
      - internal/scope/**
    public:
      - internal/scope
    # Value type + resolution over an injected Resolver; the concrete git
    # calls live in cmd. Support-tier since the decoupling refactor.
    layer: support
    subdomain: supporting
    volatility: low
  internal/ports:
    owner: alexei-led
    paths:
      - internal/ports/**
    public:
      - internal/ports
    # Neutral port contracts imported by engine and adapters.
    layer: support
    subdomain: supporting
    volatility: medium
  internal/labels:
    owner: alexei-led
    paths:
      - internal/labels/**
    public:
      - internal/labels
      - internal/labels/labelsio
    # Reviewed coupling-label artifact. Support-tier like config until the
    # value type and YAML loader split.
    layer: support
    subdomain: supporting
    volatility: medium
  # archfit: removed module "arch_tests" — verify before deleting (not found in discovery)
  # arch_tests:
  # paths:
  # - internal
  # public:
  # - internal
  # # Root internal package contains repository-level architecture tests.
  # layer: core
  # subdomain: supporting
  # volatility: low

  internal/agenttask:
    owner: alexei-led
    paths:
      - internal/agenttask/**
    public:
      - internal/agenttask
    layer: support
    subdomain: supporting
    volatility: low
  internal/facts:
    owner: alexei-led
    paths:
      - internal/facts/**
    public:
      - internal/facts
    layer: core
    subdomain: supporting
    volatility: medium
  internal/staleness:
    owner: alexei-led
    paths:
      - internal/staleness/**
    public:
      - internal/staleness
    layer: core
    subdomain: supporting
    volatility: low
  internal/toolrun:
    owner: alexei-led
    paths:
      - internal/toolrun/**
    public:
      - internal/toolrun
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/golang:
    owner: alexei-led
    paths:
      - internal/extract/golang/**
    public:
      - internal/extract/golang
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/ts:
    owner: alexei-led
    paths:
      - internal/extract/ts/**
    public:
      - internal/extract/ts
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/py:
    owner: alexei-led
    paths:
      - internal/extract/py/**
    public:
      - internal/extract/py
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/rust:
    owner: alexei-led
    paths:
      - internal/extract/rust/**
    public:
      - internal/extract/rust
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/scip:
    owner: alexei-led
    paths:
      - internal/extract/scip/**
    public:
      - internal/extract/scip
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/astgrep:
    owner: alexei-led
    paths:
      - internal/extract/astgrep/**
    public:
      - internal/extract/astgrep
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/deployunit:
    owner: alexei-led
    paths:
      - internal/extract/deployunit/**
    public:
      - internal/extract/deployunit
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/runtime:
    owner: alexei-led
    paths:
      - internal/extract/runtime/**
    public:
      - internal/extract/runtime
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/dynimports:
    owner: alexei-led
    paths:
      - internal/extract/dynimports/**
    public:
      - internal/extract/dynimports
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/clones:
    owner: alexei-led
    paths:
      - internal/extract/clones/**
    public:
      - internal/extract/clones
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/complexity:
    owner: alexei-led
    paths:
      - internal/extract/complexity/**
    public:
      - internal/extract/complexity
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/loc:
    owner: alexei-led
    paths:
      - internal/extract/loc/**
    public:
      - internal/extract/loc
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/gitnexus:
    owner: alexei-led
    paths:
      - internal/extract/gitnexus/**
    public:
      - internal/extract/gitnexus
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/output:
    owner: alexei-led
    paths:
      - internal/output/**
    public:
      - internal/output/jsonout
      - internal/output/console
      - internal/output/markdown
      - internal/output/sarif
      - internal/output/scorecard
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/initcfg:
    owner: alexei-led
    paths:
      - internal/initcfg/**
    public:
      - internal/initcfg
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/fitness:
    owner: alexei-led
    paths:
      - internal/fitness/**
    public:
      - internal/fitness
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/ownership:
    owner: alexei-led
    paths:
      - internal/ownership/**
    public:
      - internal/ownership
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/llm:
    owner: alexei-led
    paths:
      - internal/llm/**
    public:
      - internal/llm
    # Off-gate provider adapters; check path is guarded by TestArchImports.
    layer: adapter
    subdomain: generic
    volatility: low
  internal/calibrate:
    owner: alexei-led
    paths:
      - internal/calibrate/**
    public:
      - internal/calibrate
    # Pure scorer-comparison utility: no I/O, no os/exec, no YAML.
    # cmd imports it for the calibrate subcommand.
    layer: core
    subdomain: supporting
    volatility: low
  internal:
    owner: alexei-led
    paths:
      - internal/**
    public:
      - internal
    layer: support
    subdomain: generic
    volatility: low
  internal/history:
    owner: alexei-led
    paths:
      - internal/history/**
    public:
      - internal/history
      - internal/history/git
    # Git log/blame reader: out-of-process I/O, belongs in adapter tier.
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/score:
    owner: alexei-led
    paths:
      - internal/score/**
    public:
      - internal/score
    # Pure decision over already-computed Diagnostic facts — core ring.
    layer: core
    subdomain: core
    volatility: medium
  internal/extract:
    owner: alexei-led
    paths:
      - internal/extract/**
    public:
      - internal/extract
    # Broad stanza for catch-all coverage; subpackages have explicit stanzas above.
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: high
  cmd/archfit:
    owner: alexei-led
    paths:
      - cmd/archfit/**
    public:
      - cmd/archfit
    # Wiring-only composition root: imports everything to wire the pipeline.
    # Fan-out from here is cohesion, not high-distance coupling.
    role: composition_root
    layer: cmd
    subdomain: generic
    volatility: medium
rules:
  # Ring gate 1: core must not directly import the process boundary or extractors
  - id: core_no_toolrun
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/toolrun
    gate: fail
  - id: rules_no_toolrun
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/toolrun
    gate: fail
  - id: metrics_no_toolrun
    type: forbidden_dependency
    from: internal/metrics/**
    to: internal/toolrun
    gate: fail
  - id: status_no_toolrun
    type: forbidden_dependency
    from: internal/status/**
    to: internal/toolrun
    gate: fail
  - id: core_no_extract
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/extract/**
    gate: fail
  - id: rules_no_extract
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/extract/**
    gate: fail
  # Ring gate 2: engine must not import adapters directly (uses ports/interfaces only)
  - id: engine_no_extract
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/extract/**
    gate: fail
  - id: engine_no_toolrun
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/toolrun
    gate: fail
  - id: engine_no_history
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/history/**
    gate: fail
  - id: engine_no_output
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/output/**
    gate: fail
  - id: engine_no_labelsio
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/labels/labelsio/**
    gate: fail
  # Ring gate 3: model packages are pure value types
  - id: model_no_config
    type: forbidden_dependency
    from: internal/model/**
    to: internal/config
    gate: fail
  - id: model_no_baseline
    type: forbidden_dependency
    from: internal/model/**
    to: internal/baseline
    gate: fail
  # Hexagonal boundary: adapters must depend on ports, not the orchestrator.
  - id: extract_no_engine
    type: forbidden_dependency
    from: internal/extract/**
    to: internal/engine/**
    gate: fail
  # Layer direction guard. The historical engine→scope inversion was
  # resolved by decoupling scope from git and reclassifying it as support.
  - id: layer_inversion
    type: forbidden_layer_direction
    gate: fail
map_review:
  stale_after: 2160h # 90 days
  gate: warn
tools:
  go:
    enabled: "on"
  typescript:
    enabled: "off"
  python:
    enabled: "off"
  scip:
    enabled: "on"
  complexity:
    enabled: "on"
  llm:
    provider: anthropic
    model: claude-opus-4-8
  gitnexus:
    enabled: "on"
  clones:
    enabled: "on"
metrics:
  risk_hub:
    enabled: true
  # archfit enforces its own architecture (internal/arch_test.go + CI), so this
  # surfaces a real architecture_fitness signal — dogfooding the metric.
  architecture_fitness:
    enabled: true
  # Clone detection enabled (tools.clones.enabled: on). Reports n/a when jscpd
  # is not installed (install: npm install -g jscpd); yields functional-extraction
  # candidates when jscpd is present and finds cross-module duplicates.
  functional_candidates:
    enabled: true
  # cohesion_lcom (Task 20): report-only LCOM edge-density proxy over the SCIP
  # symbol graph. Disabled here because it failed its eval — document-scoped
  # SCIP attribution (no enclosing_range) leaves it blind for single-file
  # Python/TS modules and unable to credit internal sub-package cohesion. Kept
  # registered and report-only for repos that want the Go-package signal.
  # See docs/plans/notes/gap-closure-task20-cohesion-eval.md.
  cohesion_lcom:
    enabled: false
