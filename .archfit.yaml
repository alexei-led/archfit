version: 1
# --- Design rationale (Balanced Coupling, Khononov) --------------------------
# archfit is a sole-owner, single-binary modular monolith. Module definitions
# below represent cohesive product capabilities, not one stanza per Go package.
# Package paths remain explicit public contracts, while scoring happens at the
# capability boundary where coordinated change is meaningful.
#
# DDD classification is about business role, not stability or directory shape.
# Archfit's policy language, evaluation model, and fact-to-decision logic are the
# core domain and therefore high-volatility. Evidence vocabulary, pipeline
# contracts, orchestration, persistence, and tool integrations are supporting.
# Provider-specific LLM integration and composition roots are generic adapters.
#
# All modules have one owner, so ownership distance is intentionally degenerate;
# code structure and deploy-unit evidence determine distance. The book formula
# is `max(|S-D|, 10-V)+1`. Scores are consequences of this declared design, not
# targets to tune: a lower score that exposes a real seam is better than a green
# score produced by package-granular or catch-all modules.
# -----------------------------------------------------------------------------
# Balanced-Coupling advisory tuning.
coupling:
  # Minimum severity for a coupling advisory to appear in output.
  # low: all cross-module deps (noisy for well-designed codebases)
  # medium: only over-decoupled volatile seams and tight cross-boundary coupling
  # high/critical: only intrusive or functional coupling across large boundaries
  min_severity: medium
  # Book Ch7 duplicated knowledge: score clone-only cross-module pairs in the
  # headline coupling_balance by default. Set to advisory to preserve v4 output.
  duplicated_knowledge: score
  # Book Ch9 inferred-volatility cascade: a module strongly coupled (strength ≥
  # functional) to a high-effective-volatility module inherits raised effective
  # volatility. The cascade runs to a deterministic fixpoint and never lowers a
  # configured value.
  volatility_cascade: true
# Architecture layers — innermost to outermost.
# forbidden_layer_direction fires when fromRank < toRank (inner imports outer).
layers:
  - model # rank 0: pure value types, stdlib only
  - support # rank 1: config, scope
  - core # rank 2: classify, rules, metrics, status
  - engine # rank 3: orchestration pipeline
  - adapter # rank 4: baseline, toolrun, extractors, renderers, git
  - cmd # rank 5: composition root
modules:
  # Supporting evidence vocabulary. These types describe source facts, not
  # Archfit's policy decisions.
  evidence-model:
    owner: alexei-led
    role: shared_model
    paths:
      - internal/model/graph/**
      - internal/model/symbol/**
      - internal/model/fileclass/**
      - internal/model/clone/**
      - internal/model/pattern/**
    public:
      - internal/model/graph
      - internal/model/symbol
      - internal/model/fileclass
      - internal/model/clone
      - internal/model/pattern
    layer: model
    subdomain: supporting
    volatility: medium

  # Core domain vocabulary: coupling, findings, diagnostics, signals, and
  # architectural module semantics.
  evaluation-model:
    owner: alexei-led
    role: shared_model
    paths:
      - internal/model/coupling/**
      - internal/model/finding/**
      - internal/model/diagnostic/**
      - internal/model/report/**
      - internal/model/signal/**
      - internal/model/module/**
    public:
      - internal/model/coupling
      - internal/model/finding
      - internal/model/diagnostic
      - internal/model/report
      - internal/model/signal
      - internal/model/module
    layer: model
    subdomain: core
    volatility: high

  # Stable data-only projections consumed by pipeline stages.
  stage-views:
    owner: alexei-led
    role: shared_model
    paths:
      - internal/view/**
    public:
      - internal/view
    layer: model
    subdomain: supporting
    volatility: low

  # Archfit's architecture policy language and validation semantics.
  policy-language:
    owner: alexei-led
    paths:
      - internal/config/**
    public:
      - internal/config
    layer: support
    subdomain: core
    volatility: high

  # Stable process/analyzer contracts and the analysis-scope value boundary.
  pipeline-contracts:
    owner: alexei-led
    role: shared_model
    paths:
      - internal/ports/**
      - internal/scope/**
      - internal/syntax/**
    public:
      - internal/ports
      - internal/scope
      - internal/syntax
    layer: support
    subdomain: supporting
    volatility: low

  # Core fact-to-decision capability. Package boundaries remain useful for code
  # organization, but they belong to one cohesive domain module.
  evaluation-core:
    owner: alexei-led
    role: core
    paths:
      - internal/classify/**
      - internal/rules/**
      - internal/metrics/**
      - internal/facts/**
      - internal/status/**
      - internal/staleness/**
      - internal/score/**
      - internal/decision/**
      - internal/agenttask/**
    public:
      - internal/classify
      - internal/rules
      - internal/metrics
      - internal/facts
      - internal/status
      - internal/staleness
      - internal/score
      - internal/decision
      - internal/agenttask
    layer: core
    subdomain: core
    volatility: high

  # Application orchestration only: sequence stages through stable contracts.
  pipeline-engine:
    owner: alexei-led
    role: core
    paths:
      - internal/engine/**
    public:
      - internal/engine
    layer: engine
    subdomain: supporting
    volatility: medium

  # Source-fact acquisition and external-tool adapters. Per-language packages
  # remain separate implementations but form one architectural capability.
  fact-adapters:
    owner: alexei-led
    role: adapter
    paths:
      - internal/extract/**
      - internal/toolrun/**
      - internal/factcache/**
      - internal/history/**
      - internal/ownership/**
    public:
      - internal/extract/golang
      - internal/extract/ts
      - internal/extract/py
      - internal/extract/rust
      - internal/extract/scip
      - internal/extract/astgrep
      - internal/extract/deployunit
      - internal/extract/runtime
      - internal/extract/dynimports
      - internal/extract/clones
      - internal/extract/loc
      - internal/extract/manifest
      - internal/toolrun
      - internal/factcache
      - internal/history/git
      - internal/ownership
    layer: adapter
    subdomain: supporting
    volatility: medium

  # Policy-file lifecycle: discovery, update, and schema generation.
  config-lifecycle:
    owner: alexei-led
    role: adapter
    paths:
      - internal/initcfg/**
      - internal/configschema/**
    public:
      - internal/initcfg
      - internal/configschema
    layer: adapter
    subdomain: supporting
    volatility: medium

  baseline-store:
    owner: alexei-led
    role: adapter
    paths:
      - internal/baseline/**
    public:
      - internal/baseline
    layer: adapter
    subdomain: supporting
    volatility: low

  labels-policy:
    owner: alexei-led
    paths:
      - internal/labels
      - internal/labels/*.go
    public:
      - internal/labels
    layer: support
    subdomain: supporting
    volatility: medium

  labels-store:
    owner: alexei-led
    role: adapter
    paths:
      - internal/labels/labelsio/**
    public:
      - internal/labels/labelsio
    layer: adapter
    subdomain: supporting
    volatility: low

  rendering:
    owner: alexei-led
    role: adapter
    paths:
      - internal/output/**
    public:
      - internal/output/console
      - internal/output/jsonout
      - internal/output/markdown
      - internal/output/sarif
      - internal/output/scorecard
    layer: adapter
    subdomain: supporting
    volatility: medium

  llm-adapter:
    owner: alexei-led
    role: adapter
    paths:
      - internal/llm/**
    public:
      - internal/llm
    layer: adapter
    subdomain: generic
    volatility: medium

  archfit-cli:
    owner: alexei-led
    role: composition_root
    paths:
      - cmd/archfit/**
    public:
      - cmd/archfit
    layer: cmd
    subdomain: generic
    volatility: medium

  development-tools:
    owner: alexei-led
    role: composition_root
    paths:
      - cmd/calibrate/**
      - internal/calibrate/**
      - scripts/eval/**
    public:
      - cmd/calibrate
      - internal/calibrate
      - scripts/eval
    layer: cmd
    subdomain: generic
    volatility: low

  architecture-tests:
    owner: alexei-led
    role: test
    paths:
      - internal
    layer: cmd
    subdomain: generic
    volatility: low
rules:
  # Ring gate 1: core must not directly import the process boundary or extractors
  - id: core_no_toolrun
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/toolrun
    gate: fail
  - id: rules_no_toolrun
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/toolrun
    gate: fail
  - id: metrics_no_toolrun
    type: forbidden_dependency
    from: internal/metrics/**
    to: internal/toolrun
    gate: fail
  - id: status_no_toolrun
    type: forbidden_dependency
    from: internal/status/**
    to: internal/toolrun
    gate: fail
  - id: core_no_extract
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/extract/**
    gate: fail
  - id: rules_no_extract
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/extract/**
    gate: fail
  # Ring gate 2: engine must not import adapters directly (uses ports/interfaces only)
  - id: engine_no_extract
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/extract/**
    gate: fail
  - id: engine_no_toolrun
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/toolrun
    gate: fail
  - id: engine_no_history
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/history/**
    gate: fail
  - id: engine_no_output
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/output/**
    gate: fail
  - id: internal_no_labelsio
    type: forbidden_dependency
    from: internal/**
    to: internal/labels/labelsio/**
    gate: fail
  # LLM provider adapters are off-gate. Only cmd hosts explicit LLM flows.
  - id: internal_no_llm
    type: forbidden_dependency
    from: internal/**
    to: internal/llm/**
    gate: fail
  # Ring gate 3: model packages are pure value types
  - id: model_no_config
    type: forbidden_dependency
    from: internal/model/**
    to: internal/config
    gate: fail
  - id: model_no_baseline
    type: forbidden_dependency
    from: internal/model/**
    to: internal/baseline
    gate: fail
  # Stage-contract package stays data-only: view may import only the model kernel.
  - id: view_no_config
    type: forbidden_dependency
    from: internal/view/**
    to: internal/config
    gate: fail
  # Policy-language boundary: runtime stages consume internal/view contracts,
  # not the volatile config decoder/model. Only composition roots and the
  # config-lifecycle adapters may import internal/config.
  - id: classify_no_config
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/config
    gate: fail
  - id: rules_no_config
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/config
    gate: fail
  - id: metrics_no_config
    type: forbidden_dependency
    from: internal/metrics/**
    to: internal/config
    gate: fail
  - id: extract_no_config
    type: forbidden_dependency
    from: internal/extract/**
    to: internal/config
    gate: fail
  - id: staleness_no_config
    type: forbidden_dependency
    from: internal/staleness/**
    to: internal/config
    gate: fail
  - id: scope_no_config
    type: forbidden_dependency
    from: internal/scope/**
    to: internal/config
    gate: fail
  - id: engine_no_config
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/config
    gate: fail
  - id: facts_no_config
    type: forbidden_dependency
    from: internal/facts/**
    to: internal/config
    gate: fail
  - id: status_no_config
    type: forbidden_dependency
    from: internal/status/**
    to: internal/config
    gate: fail
  - id: syntax_no_config
    type: forbidden_dependency
    from: internal/syntax/**
    to: internal/config
    gate: fail
  - id: score_no_config
    type: forbidden_dependency
    from: internal/score/**
    to: internal/config
    gate: fail
  - id: decision_no_config
    type: forbidden_dependency
    from: internal/decision/**
    to: internal/config
    gate: fail
  - id: agenttask_no_config
    type: forbidden_dependency
    from: internal/agenttask/**
    to: internal/config
    gate: fail
  - id: ports_no_config
    type: forbidden_dependency
    from: internal/ports/**
    to: internal/config
    gate: fail
  - id: baseline_no_config
    type: forbidden_dependency
    from: internal/baseline/**
    to: internal/config
    gate: fail
  - id: output_no_config
    type: forbidden_dependency
    from: internal/output/**
    to: internal/config
    gate: fail
  - id: labels_no_config
    type: forbidden_dependency
    from: internal/labels/**
    to: internal/config
    gate: fail
  - id: toolrun_no_config
    type: forbidden_dependency
    from: internal/toolrun/**
    to: internal/config
    gate: fail
  - id: factcache_no_config
    type: forbidden_dependency
    from: internal/factcache/**
    to: internal/config
    gate: fail
  - id: history_no_config
    type: forbidden_dependency
    from: internal/history/**
    to: internal/config
    gate: fail
  - id: ownership_no_config
    type: forbidden_dependency
    from: internal/ownership/**
    to: internal/config
    gate: fail
  # Stable-contract boundaries: persistence and rendering must not bind to
  # volatile evaluation implementations. Current violations are intentional
  # findings until the code exposes stable snapshot/report contracts.
  - id: baseline_no_score
    type: forbidden_dependency
    from: internal/baseline/**
    to: internal/score/**
    gate: fail
  - id: output_no_score
    type: forbidden_dependency
    from: internal/output/**
    to: internal/score/**
    gate: fail
  - id: output_no_decision
    type: forbidden_dependency
    from: internal/output/**
    to: internal/decision/**
    gate: fail
  # Hexagonal boundary: internal packages depend on ports, not the orchestrator.
  # Only cmd imports internal/engine.
  - id: internal_no_engine
    type: forbidden_dependency
    from: internal/**
    to: internal/engine/**
    gate: fail
  # Layer direction guard. The historical engine→scope inversion was
  # resolved by decoupling scope from git and reclassifying it as support.
  - id: layer_inversion
    type: forbidden_layer_direction
    gate: fail
  # --- Syntax-facts lint rule (gate: warn = advisory, non-blocking) ---
  # public_api_max is global (no per-module scoping); keep the ceiling above the
  # largest measured exported surface. Current max is cmd/archfit (~281 exported
  # declarations); 320 keeps headroom while catching a module that turns into a
  # dumping ground.
  - id: syntax_api_size_ceiling
    type: public_api_max
    max: 320
    gate: warn
  # Public-API framework-type-leak — advisory dogfooding. Fires when an exported
  # field or function return type names an external (non-first-party) package.
  # archfit's adapter/cmd layers legitimately expose external types (kong, SDKs),
  # so this is a candidate-surfacer kept non-blocking (warn); the model/core ring
  # is guarded structurally by the forbidden_dependency rules above.
  - id: arch_public_api_type_leak
    type: public_api_type_leak
    gate: warn
module_review:
  stale_after: 2160h # 90 days
  gate: warn
languages:
  go:
    enabled: true
  typescript:
    enabled: false
  python:
    enabled: false
analyzers:
  # Syntax-facts provider (ast-grep). Enabled for dogfooding — produces
  # syntax_facts (declarations, exported surface, roles, routes) visible in
  # analyze/agent_tasks output. Off-gate by itself; gate rules below.
  syntax:
    enabled: true
    gate: fail
  scip:
    enabled: true
    gate: fail
  clones:
    enabled: true
    gate: fail
ai:
  provider: anthropic
  model: claude-opus-4-8
