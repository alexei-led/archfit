rules:
  # Ring gate 1: core must not directly import the process boundary or extractors
  - id: core_no_toolrun
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/toolrun
    gate: fail
  - id: rules_no_toolrun
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/toolrun
    gate: fail
  - id: metrics_no_toolrun
    type: forbidden_dependency
    from: internal/metrics/**
    to: internal/toolrun
    gate: fail
  - id: status_no_toolrun
    type: forbidden_dependency
    from: internal/status/**
    to: internal/toolrun
    gate: fail
  - id: core_no_extract
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/extract/**
    gate: fail
  - id: rules_no_extract
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/extract/**
    gate: fail
  # Ring gate 2: engine must not import adapters directly (uses ports/interfaces only)
  - id: engine_no_extract
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/extract/**
    gate: fail
  - id: engine_no_toolrun
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/toolrun
    gate: fail
  - id: engine_no_history
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/history/**
    gate: fail
  - id: engine_no_output
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/output/**
    gate: fail
  - id: engine_no_labelsio
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/labels/labelsio/**
    gate: fail
  # Ring gate 3: model packages are pure value types
  - id: model_no_config
    type: forbidden_dependency
    from: internal/model/**
    to: internal/config
    gate: fail
  - id: model_no_baseline
    type: forbidden_dependency
    from: internal/model/**
    to: internal/baseline
    gate: fail
  # Hexagonal boundary: adapters must depend on ports, not the orchestrator.
  - id: extract_no_engine
    type: forbidden_dependency
    from: internal/extract/**
    to: internal/engine/**
    gate: fail
  # Layer direction guard. The historical engine→scope inversion was
  # resolved by decoupling scope from git and reclassifying it as support.
  - id: layer_inversion
    type: forbidden_layer_direction
    gate: warn
map_review:
  stale_after: 2160h # 90 days
  gate: warn
tools:
  go:
    enabled: "on"
  typescript:
    enabled: "off"
  python:
    enabled: "off"
  scip:
    enabled: "on"
  complexity:
    enabled: "on"
  llm:
    provider: anthropic
    model: claude-opus-4-8
  gitnexus:
    enabled: "on"
  clones:
    enabled: "off"
metrics:
  risk_hub:
    enabled: true
  # archfit enforces its own architecture (internal/arch_test.go + CI), so this
  # surfaces a real architecture_fitness signal — dogfooding the metric.
  architecture_fitness:
    enabled: true
  # Surfaced on; reports n/a with an actionable coverage reason until a clone
  # detector (tools.clones) is installed, then yields functional-extraction
  # candidates. Enabling the metric makes that coverage gap visible in the report.
  functional_candidates:
    enabled: true
