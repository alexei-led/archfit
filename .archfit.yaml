version: 1
# --- Design rationale (Balanced Coupling, Khononov) --------------------------
# archfit is a SOLE-OWNER, single-binary modular monolith. Every module declares
# `owner: alexei-led`, making the owner map degenerate (all same owner). The BC
# distance classifier falls through to code-structure distance (Step 4), and
# archfit's modules are all hierarchical (nested paths), so siblings and
# parent-child pairs resolve to `cross_module_same_owner` — book ordinal 4, the
# LOWEST cross-module distance. There is no lower cross-module band to claim;
# same-owner IS the floor. Flat single-segment names also resolve to
# cross_module_same_owner in the degenerate-owner path (P1 fix).
#
# Volatility is essential/domain-based (Ch9), never churn: the analysis core
# (`internal/model/*`, classify, rules, metrics, score) is `subdomain: core` →
# high volatility because it evolves with every feature; adapters/support/generic
# are low. This is correct by design, not a gap.
#
# How to read coupling_balance: the book formula is `max(|S-D|, 10-V)+1`. With the
# core at V=high (10) and distance fixed at 4, coupling INTO the core scores in the
# mixed/high band regardless of strength — this is the honest signal that the
# shared domain model (`Diagnostic`/`graph`/`coupling`) is a high-volatility,
# high-fan-in hub (see blast_radius). The book's lever to improve it is
# to lower the CORE's volatility or wrap it in a contract (reduce strength), NOT to
# re-weight the metric. The frozen book ordinals are adopted verbatim and must not
# be tuned to flatter this repo's own score.
# -----------------------------------------------------------------------------
# Balanced-Coupling advisory tuning.
coupling:
  # Minimum severity for a coupling advisory to appear in output.
  # low: all cross-module deps (noisy for well-designed codebases)
  # medium: only over-decoupled volatile seams and tight cross-boundary coupling
  # high/critical: only intrusive or functional coupling across large boundaries
  min_severity: medium
  # Book Ch7 duplicated knowledge: score clone-only cross-module pairs in the
  # headline coupling_balance by default. Set to advisory to preserve v4 output.
  duplicated_knowledge: score
  # Book Ch9 inferred-volatility cascade: a module strongly coupled (strength ≥
  # functional) to a high-volatility module inherits raised effective volatility.
  # Config-declared volatility always takes precedence and is never lowered.
  volatility_cascade: true
# Architecture layers — innermost to outermost.
# forbidden_layer_direction fires when fromRank < toRank (inner imports outer).
layers:
  - model # rank 0: pure value types, stdlib only
  - support # rank 1: config, scope
  - core # rank 2: classify, rules, metrics, status
  - engine # rank 3: orchestration pipeline
  - adapter # rank 4: baseline, toolrun, extractors, renderers, git
  - cmd # rank 5: composition root
modules:
  internal/model:
    owner: alexei-led
    paths:
      - internal/model/**
    # public = the package paths themselves (not file paths)
    public:
      - internal/model/graph
      - internal/model/finding
      - internal/model/coupling
      - internal/model/diagnostic
      - internal/model/clone
      - internal/model/pattern
      - internal/model/signal
      - internal/model/symbol
    layer: model
    # Core domain model — these types evolve with every new feature (new
    # Diagnostic fields, graph node types, coupling constants). Volatile by
    # nature; book anchor core→V=10. No explicit volatility override.
    subdomain: core
  internal/config:
    owner: alexei-led
    paths:
      - internal/config/**
    public:
      - internal/config
    layer: support
    subdomain: supporting
    volatility: medium
  internal/baseline:
    owner: alexei-led
    paths:
      - internal/baseline/**
    public:
      - internal/baseline
    # Persistence (reads/writes the baseline file) — adapter, not support.
    # status consumes it through the status.AcceptedSet interface.
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/classify:
    owner: alexei-led
    paths:
      - internal/classify/**
    public:
      - internal/classify
    layer: core
    subdomain: core
    volatility: medium
  internal/rules:
    owner: alexei-led
    paths:
      - internal/rules/**
    public:
      - internal/rules
    layer: core
    subdomain: core
    volatility: medium
  internal/metrics:
    owner: alexei-led
    paths:
      - internal/metrics/**
    public:
      - internal/metrics
      - internal/metrics/boundary
      - internal/metrics/intramodule
      - internal/metrics/modularity
      - internal/metrics/risk
      - internal/metrics/metricstest
      - internal/metrics/internal/modgraph
      - internal/metrics/internal/result
    layer: core
    subdomain: core
    volatility: medium
  internal/status:
    owner: alexei-led
    paths:
      - internal/status/**
    public:
      - internal/status
    layer: core
    # AcceptedSet / AcceptedItem: stable infrastructure tracking baseline
    # exceptions, not domain logic. Supporting subdomain; low volatility
    # (stable since the decoupling refactor). Book anchor: supporting→V=3.
    subdomain: supporting
    volatility: low
  internal/engine:
    owner: alexei-led
    paths:
      - internal/engine/**
    public:
      - internal/engine
    layer: engine
    subdomain: core
    volatility: medium
  internal/scope:
    owner: alexei-led
    paths:
      - internal/scope/**
    public:
      - internal/scope
    # Value type + resolution over an injected Resolver; the concrete git
    # calls live in cmd. Support-tier since the decoupling refactor.
    layer: support
    subdomain: supporting
    volatility: low
  internal/ports:
    owner: alexei-led
    paths:
      - internal/ports/**
    public:
      - internal/ports
    # Neutral port contracts imported by engine and adapters.
    layer: support
    subdomain: supporting
    volatility: medium
  internal/labels:
    owner: alexei-led
    paths:
      - internal/labels/**
    public:
      - internal/labels
      - internal/labels/labelsio
    # Reviewed coupling-label artifact. Support-tier like config until the
    # value type and YAML loader split.
    layer: support
    subdomain: supporting
    volatility: medium
  # archfit: removed module "arch_tests" — verify before deleting (not found in discovery)
  # arch_tests:
  # paths:
  # - internal
  # public:
  # - internal
  # # Root internal package contains repository-level architecture tests.
  # layer: core
  # subdomain: supporting
  # volatility: low

  internal/agenttask:
    owner: alexei-led
    paths:
      - internal/agenttask/**
    public:
      - internal/agenttask
    layer: support
    subdomain: supporting
    volatility: low
  internal/facts:
    owner: alexei-led
    paths:
      - internal/facts/**
    public:
      - internal/facts
    layer: core
    subdomain: supporting
    volatility: medium
  internal/staleness:
    owner: alexei-led
    paths:
      - internal/staleness/**
    public:
      - internal/staleness
    layer: core
    subdomain: supporting
    volatility: low
  internal/toolrun:
    owner: alexei-led
    paths:
      - internal/toolrun/**
    public:
      - internal/toolrun
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/factcache:
    owner: alexei-led
    paths:
      - internal/factcache/**
    public:
      - internal/factcache
    # Extractor-fact cache adapter (os I/O decorating toolrun.Runner) — see
    # docs/design/fact-cache.md. Never on the decision path: stores facts,
    # not scores.
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/golang:
    owner: alexei-led
    paths:
      - internal/extract/golang/**
    public:
      - internal/extract/golang
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/ts:
    owner: alexei-led
    paths:
      - internal/extract/ts/**
    public:
      - internal/extract/ts
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/py:
    owner: alexei-led
    paths:
      - internal/extract/py/**
    public:
      - internal/extract/py
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/rust:
    owner: alexei-led
    paths:
      - internal/extract/rust/**
    public:
      - internal/extract/rust
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/scip:
    owner: alexei-led
    paths:
      - internal/extract/scip/**
    public:
      - internal/extract/scip
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/astgrep:
    owner: alexei-led
    paths:
      - internal/extract/astgrep/**
    public:
      - internal/extract/astgrep
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/extract/deployunit:
    owner: alexei-led
    paths:
      - internal/extract/deployunit/**
    public:
      - internal/extract/deployunit
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/runtime:
    owner: alexei-led
    paths:
      - internal/extract/runtime/**
    public:
      - internal/extract/runtime
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/dynimports:
    owner: alexei-led
    paths:
      - internal/extract/dynimports/**
    public:
      - internal/extract/dynimports
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/clones:
    owner: alexei-led
    paths:
      - internal/extract/clones/**
    public:
      - internal/extract/clones
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/loc:
    owner: alexei-led
    paths:
      - internal/extract/loc/**
    public:
      - internal/extract/loc
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/extract/manifest:
    owner: alexei-led
    paths:
      - internal/extract/manifest/**
    public:
      - internal/extract/manifest
    # Manifest-marker reader (go.mod retract, package.json deprecated, cargo
    # yanked). Out-of-process file read; adapter tier like the other extractors.
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/output:
    owner: alexei-led
    paths:
      - internal/output/**
    public:
      - internal/output/jsonout
      - internal/output/console
      - internal/output/markdown
      - internal/output/sarif
      - internal/output/scorecard
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/initcfg:
    owner: alexei-led
    paths:
      - internal/initcfg/**
    public:
      - internal/initcfg
    layer: adapter
    subdomain: supporting
    volatility: medium
  internal/ownership:
    owner: alexei-led
    paths:
      - internal/ownership/**
    public:
      - internal/ownership
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/llm:
    owner: alexei-led
    paths:
      - internal/llm/**
    public:
      - internal/llm
    # Off-gate provider adapters; check path is guarded by TestArchImports.
    layer: adapter
    subdomain: generic
    volatility: low
  internal/calibrate:
    owner: alexei-led
    paths:
      - internal/calibrate/**
    public:
      - internal/calibrate
    # Pure scorer-comparison utility: no I/O, no os/exec, no YAML.
    # cmd imports it for the calibrate subcommand.
    layer: core
    subdomain: supporting
    volatility: low
  internal:
    owner: alexei-led
    paths:
      - internal/**
    public:
      - internal
    # Catch-all stanza. With most-specific module resolution (config.ModuleMap.
    # ModuleFor picks the longest-prefix glob, not first-match), every specific
    # stanza above wins for its own subtree, so `internal/**` here resolves ONLY
    # paths nothing more specific matches: root-level internal/arch_test.go plus
    # testdata and helper fixtures (internal/extract/astgrep/testdata/**,
    # internal/extract/py helper scripts). Verified: zero production graph nodes
    # resolve to this module. Any unsafe/panic/lazy-import facts reported under
    # module "internal" therefore come from FIXTURES, not production code.
    layer: support
    subdomain: generic
    volatility: low
  internal/history:
    owner: alexei-led
    paths:
      - internal/history/**
    public:
      - internal/history
      - internal/history/git
    # Git log/blame reader: out-of-process I/O, belongs in adapter tier.
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: low
  internal/score:
    owner: alexei-led
    paths:
      - internal/score/**
    public:
      - internal/score
    # Pure decision over already-computed Diagnostic facts — core ring.
    layer: core
    subdomain: core
    volatility: medium
  internal/decision:
    owner: alexei-led
    paths:
      - internal/decision/**
    public:
      - internal/decision
    # Synthesises the human-decision view-model (band, recommendations) from an
    # already-computed Diagnostic + Scorecard — core ring, depends on score.
    layer: core
    subdomain: core
    volatility: medium
  internal/extract:
    owner: alexei-led
    paths:
      - internal/extract/**
    public:
      - internal/extract
    # Broad stanza for catch-all coverage; subpackages have explicit stanzas above.
    role: adapter
    layer: adapter
    subdomain: supporting
    volatility: high
  cmd/archfit:
    owner: alexei-led
    paths:
      - cmd/archfit/**
    public:
      - cmd/archfit
    # Wiring-only composition root: imports everything to wire the pipeline.
    # Fan-out from here is cohesion, not high-distance coupling.
    role: composition_root
    layer: cmd
    subdomain: generic
    volatility: medium
  scripts/eval/coverage:
    owner: alexei-led
    paths:
      - scripts/eval/coverage/**
    public:
      - scripts/eval/coverage
    # Standalone gap-closure coverage-table generator (package main, no internal
    # imports). Eval tooling, not shipped architecture; tracked so map_review
    # covers it and it does not surface as an uncovered-path advisory.
    layer: cmd
    subdomain: generic
    volatility: low
rules:
  # Ring gate 1: core must not directly import the process boundary or extractors
  - id: core_no_toolrun
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/toolrun
    gate: fail
  - id: rules_no_toolrun
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/toolrun
    gate: fail
  - id: metrics_no_toolrun
    type: forbidden_dependency
    from: internal/metrics/**
    to: internal/toolrun
    gate: fail
  - id: status_no_toolrun
    type: forbidden_dependency
    from: internal/status/**
    to: internal/toolrun
    gate: fail
  - id: core_no_extract
    type: forbidden_dependency
    from: internal/classify/**
    to: internal/extract/**
    gate: fail
  - id: rules_no_extract
    type: forbidden_dependency
    from: internal/rules/**
    to: internal/extract/**
    gate: fail
  # Ring gate 2: engine must not import adapters directly (uses ports/interfaces only)
  - id: engine_no_extract
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/extract/**
    gate: fail
  - id: engine_no_toolrun
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/toolrun
    gate: fail
  - id: engine_no_history
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/history/**
    gate: fail
  - id: engine_no_output
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/output/**
    gate: fail
  - id: engine_no_labelsio
    type: forbidden_dependency
    from: internal/engine/**
    to: internal/labels/labelsio/**
    gate: fail
  # Ring gate 3: model packages are pure value types
  - id: model_no_config
    type: forbidden_dependency
    from: internal/model/**
    to: internal/config
    gate: fail
  - id: model_no_baseline
    type: forbidden_dependency
    from: internal/model/**
    to: internal/baseline
    gate: fail
  # Hexagonal boundary: adapters must depend on ports, not the orchestrator.
  - id: extract_no_engine
    type: forbidden_dependency
    from: internal/extract/**
    to: internal/engine/**
    gate: fail
  # Layer direction guard. The historical engine→scope inversion was
  # resolved by decoupling scope from git and reclassifying it as support.
  - id: layer_inversion
    type: forbidden_layer_direction
    gate: fail
  # --- Syntax-facts example rule (gate: warn = advisory, non-blocking) ---
  # Example: warn when any module's exported API exceeds a generous ceiling.
  # public_api_max is global (no per-module scoping); the threshold must exceed
  # the largest module count. archfit's catch-all "internal" module currently
  # resolves ~1521 exported declarations (verified via `make archfit-report`);
  # max: 1600 gives headroom above the measured count. Revert to 1500 only after
  # splitting the catch-all stanza and verifying per-module counts are below it.
  # In practice, set max per module after splitting the catch-all stanza.
  - id: syntax_api_size_ceiling
    type: public_api_max
    max: 1600
    gate: warn
  # Public-API framework-type-leak — advisory dogfooding. Fires when an exported
  # field or function return type names an external (non-first-party) package.
  # archfit's adapter/cmd layers legitimately expose external types (kong, SDKs),
  # so this is a candidate-surfacer kept non-blocking (warn); the model/core ring
  # is guarded structurally by the forbidden_dependency rules above.
  - id: arch_public_api_type_leak
    type: public_api_type_leak
    gate: warn
module_review:
  stale_after: 2160h # 90 days
  gate: warn
languages:
  go:
    enabled: true
  typescript:
    enabled: false
  python:
    enabled: false
analyzers:
  # Syntax-facts provider (ast-grep). Enabled for dogfooding — produces
  # syntax_facts (declarations, exported surface, roles, routes) visible in
  # analyze/agent_tasks output. Off-gate by itself; gate rules below.
  syntax:
    enabled: true
  scip:
    enabled: true
  clones:
    enabled: true
ai:
  provider: anthropic
  model: claude-opus-4-8
