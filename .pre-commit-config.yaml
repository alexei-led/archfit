---
minimum_pre_commit_version: 4.0.0
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        stages:
          - pre-commit
      - id: go-mod-tidy
        stages:
          - pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages:
          - pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: commit-signing-enabled
        name: commit signing enabled
        language: system
        entry: 'bash -c ''if [ "$(git config --bool commit.gpgsign 2>/dev/null || echo false)" != "true" ]; then echo "Commit signing required. Run: git config --local commit.gpgsign true" >&2; exit 1; fi'''
        stages:
          - pre-commit
        pass_filenames: false
        always_run: true
      - id: gitleaks-pre-push
        name: gitleaks pre-push scan
        language: system
        entry: bash -c 'command -v gitleaks >/dev/null || { echo "gitleaks is required. Install it, then retry." >&2; exit 1; }; gitleaks git --redact --verbose --no-banner'
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: make-lint
        name: make lint
        language: system
        entry: make lint
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: make-test
        name: make test
        language: system
        entry: make test
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: make-build
        name: make build
        language: system
        entry: make build
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: arch-lint
        name: arch-lint (archfit architecture drift gate)
        language: system
        entry: make arch-lint
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
