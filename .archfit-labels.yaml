# Architect-authored strength labels for archfit's main cross-boundary seams.
# Reviewed by: Alexei Ledenev (architect)
# Method: human — grounded in design docs, CLAUDE.md, arch_test.go invariants,
#         and direct code reading. No LLM involved; provenance: human throughout.
# Note: the 447 unknown-strength edges are resolved primarily by adding missing
#       public: glob entries in .archfit.yaml (Task 13 config fix). These labels
#       cover the remaining cross-boundary module-pair seams that globs cannot
#       express (model vs. functional distinction for specific caller→callee pairs).
#
# Strength taxonomy (Khononov BC model):
#   contract   — consumer depends on a deliberately published stable interface
#   model      — consumer depends on producer's data/domain types (types cross boundary)
#   functional — consumer invokes producer's behavior (calls functions, no deep type coupling)
#   intrusive  — consumer reaches into internals, private state, or implementation details
labels:
  # --- engine → core ring ---
  - from: internal/engine
    to: internal/classify
    strength: functional
    rationale: engine calls classify.Run to produce the coupling.Index; invokes behavior, no shared domain types beyond the Index itself.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/rules
    strength: functional
    rationale: engine calls rules.Check to evaluate the classified index; pure behavior invocation.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/metrics
    strength: functional
    rationale: engine calls metric calculators via the Metric interface; behavior invocation on stable ports.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/facts
    strength: functional
    rationale: engine calls facts.Build to assemble collected signals; behavior invocation.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/staleness
    strength: functional
    rationale: engine calls staleness.Check to detect stale labels; behavior invocation.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/status
    strength: functional
    rationale: engine uses status.AcceptedSet to filter baseline exceptions; invokes stable behavior interface.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/labels
    strength: functional
    rationale: engine calls labels.Approved to load approved labels into the classify config; behavior invocation on pure package.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/scope
    strength: model
    rationale: engine carries scope.Scope values and resolver signatures; the resolving behavior itself lives in cmd.
    status: approved
    confidence: high
    provenance: human
  - from: internal/engine
    to: internal/ports
    strength: contract
    rationale: engine depends on ports.Runner and ports.Analyzer interfaces — deliberately published stable contracts for subprocess and analyzer injection.
    status: approved
    confidence: high
    provenance: human
  # --- classify → model ring ---
  - from: internal/classify
    to: internal/model
    strength: model
    rationale: classify consumes coupling.Strength/Distance/Volatility/Classification value types and graph.Edge/Node — pure data model coupling, no behavior invocation beyond value construction.
    status: approved
    confidence: high
    provenance: human
  - from: internal/classify
    to: internal/config
    strength: model
    rationale: classify receives config.ClassifyConfig (a typed view) and reads ModuleDef value types; data model coupling, not behavior.
